apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno-reporter
spec:
  interval: 30m
  chart:
    spec:
      chart: policy-reporter
      version: "3.7.4"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
