apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: internal
      namespace: main-gateway
      sectionName: https-hubble
  hostnames:
    - "hubble.yuriy-lab.cloud"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
