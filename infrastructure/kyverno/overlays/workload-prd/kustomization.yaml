apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - exceptions
  - mutate-goldilocks-label.yaml
  - mutate-goldilocks-label-rbac.yaml
patches:
  - path: helm-release-patch.yaml
    target:
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
  - path: helm-release-policies-patch.yaml
    target:
      kind: HelmRelease
      name: kyverno-policies
      namespace: kyverno
