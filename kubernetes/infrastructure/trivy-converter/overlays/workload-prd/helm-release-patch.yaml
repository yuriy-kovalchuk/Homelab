apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: trivy-converter
spec:
  values:
    kubeClientQPS: 50
    kubeClientBurst: 100
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    adapters:
      cisKubeBenchReports:
        enabled: false
      # Per-pod vuln reports are extremely numerous (one per pod/replicaset).
      # ClusterVulnerabilityReports (enabled below) already cover CVE data
      # cluster-wide with far fewer objects, avoiding the startup cache timeout.
      vulnerabilityReports:
        enabled: false
      configAuditReports:
        enabled: true
      complianceReports:
        enabled: true
      rbacAssessmentReports:
        enabled: true
      exposedSecretReports:
        enabled: true
      infraAssessmentReports:
        enabled: true
      clusterInfraAssessmentReports:
        enabled: true
      clusterVulnerabilityReports:
        enabled: true
    podSecurityContext:
      fsGroup: 12345
    securityContext:
      runAsUser: 12345
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
