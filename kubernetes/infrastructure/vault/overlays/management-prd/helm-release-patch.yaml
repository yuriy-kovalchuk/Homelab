apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  chart:
    spec:
      version: "0.32.0"
  values:
    server:
      standalone:
        enabled: true
      dataStorage:
        enabled: true
        size: 5Gi
      auditStorage:
        enabled: true
        size: 1Gi
    ui:
      enabled: true
      serviceType: ClusterIP
    injector:
      enabled: false
