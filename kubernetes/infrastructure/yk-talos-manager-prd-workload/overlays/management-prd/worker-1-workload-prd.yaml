apiVersion: talos.yuriykovalchuk.dev/v1alpha1
kind: TalosNode
metadata:
  name: worker-1
  namespace: yk-talos-manager-prd-workload
spec:
  clusterRef: workload-prd
  role: Worker
  nodeIP: 10.0.4.4
  talosVersion: v1.13.4
  systemExtensions:
    - siderolabs/iscsi-tools
    - siderolabs/util-linux-tools
    - siderolabs/amdgpu
    - siderolabs/amd-ucode
    - siderolabs/nonfree-kmod-nvidia-production
    - siderolabs/nvidia-container-toolkit-production
  patches:
    - |
      machine:
        kernel:
          modules:
            - name: nvidia
            - name: nvidia_uvm
            - name: nvidia_drm
            - name: nvidia_modeset
        sysctls:
          net.core.bpf_jit_harden: 1
        install:
          image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.13.2
          disk: /dev/nvme0n1
          wipe: true
        network:
          hostname: node-3
          nameservers:
            - 10.0.4.1
          interfaces:
            - interface: enp2s0
              dhcp: false
              addresses:
                - 10.0.4.4/24
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.0.4.1
                  metric: 1024
              mtu: 1500
        nodeLabels:
          machineSize: large
      cluster:
        allowSchedulingOnControlPlanes: true
        proxy:
          disabled: true
        network:
          cni:
            name: none
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: docker.io
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/dockerhub
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: ghcr.io
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/ghcr
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: gcr.io
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/gcr
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: registry.k8s.io
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/k8s
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: quay.io
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/quay
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: public.ecr.aws
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/ecr-public
          overridePath: true
    - |
      apiVersion: v1alpha1
      kind: RegistryMirrorConfig
      name: mcr.microsoft.com
      endpoints:
        - url: https://harbor.mgmt.yuriy-lab.cloud/v2/mcr
          overridePath: true
