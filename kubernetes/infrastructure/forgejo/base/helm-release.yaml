apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      rootless: true

    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    gitea:
      admin:
        existingSecret: forgejo-admin
      config:
        APP_NAME: "Forgejo"
        server:
          SSH_LISTEN_PORT: 2222
          SSH_PORT: 22
          SSH_DOMAIN: forgejo.yuriy-lab.cloud
        database:
          DB_TYPE: sqlite3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    service:
      ssh:
        type: ClusterIP
        port: 22

    ingress:
      enabled: false
