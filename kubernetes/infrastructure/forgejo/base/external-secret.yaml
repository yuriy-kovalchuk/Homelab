apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo/admin
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo/admin
        property: password
    - secretKey: email
      remoteRef:
        key: forgejo/admin
        property: email
