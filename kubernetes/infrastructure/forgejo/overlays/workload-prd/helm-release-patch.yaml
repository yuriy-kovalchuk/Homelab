apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  values:
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: main-gateway
          sectionName: https-forgejo
      hostnames:
        - forgejo.yuriy-lab.cloud

    tcpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: main-gateway
          sectionName: ssh-forgejo
      port: 22
