apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tempo
spec:
  interval: 5m
  releaseName: tempo
  chart:
    spec:
      chart: tempo-distributed
      version: "2.23.4"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
