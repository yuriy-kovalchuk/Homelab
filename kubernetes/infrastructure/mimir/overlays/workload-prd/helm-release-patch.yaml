apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: mimir
spec:
  values:
    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-credentials
      extraArgs:
        - -config.expand-env=true

    mimir:
      structuredConfig:
        memberlist:
          cluster_label: "mimir"
          cluster_label_verification_disabled: false

        server:
          log_level: info
          grpc_server_max_recv_msg_size: 104857600
          grpc_server_max_send_msg_size: 104857600
          grpc_server_max_concurrent_streams: 1000

        limits:
          max_label_names_per_series: 120
          max_global_series_per_user: 12000000
          max_global_series_per_metric: 1000000
          compactor_blocks_retention_period: 3d
          max_query_parallelism: 240
          max_queriers_per_tenant: 0
          query_sharding_total_shards: 128
          query_sharding_max_sharded_queries: 256
          request_rate: 0
          request_burst_size: 0
          ingestion_rate: 100000
          ingestion_burst_size: 200000
          query_ingesters_within: 25h

        query_scheduler:
          max_outstanding_requests_per_tenant: 10000

        blocks_storage:
          backend: s3
          s3:
            endpoint: "10.0.3.4:9000"
            region: "eu-south-1"
            access_key_id: "${access_key_id}"
            secret_access_key: "${secret_access_key}"
            bucket_name: "mimir-data"
            insecure: true
            http:
              insecure_skip_verify: true

          tsdb:
            dir: /data/tsdb
            block_ranges_period: [1h]
            retention_period: 24h
            ship_interval: 1m
            flush_blocks_on_shutdown: true
            head_compaction_interval: 1m
            wal_compression_enabled: true
          bucket_store:
            sync_interval: 5m
            ignore_blocks_within: 1h

        querier:
          query_store_after: 24h

        compactor:
          compaction_interval: 2h
          data_dir: /data/compactor

        ingest_storage:
          enabled: false

        ingester:
          push_grpc_method_enabled: true
          ring:
            zone_awareness_enabled: false
            replication_factor: 3
            kvstore:
              store: memberlist

        store_gateway:
          sharding_ring:
            zone_awareness_enabled: false
            replication_factor: 3
            kvstore:
              store: memberlist

    distributor:
      replicas: 3
      extraArgs:
        auth.multitenancy-enabled: false

    ingester:
      zoneAwareReplication:
        enabled: false
      persistentVolume:
        enabled: true
        size: 50Gi
        storageClass: "longhorn"
      replicas: 3

    querier:
      replicas: 2

    query_frontend:
      replicas: 2

    query_scheduler:
      replicas: 2

    store_gateway:
      persistentVolume:
        enabled: true
        size: 2Gi
        storageClass: "longhorn"
      zoneAwareReplication:
        enabled: false
      replicas: 3

    compactor:
      replicas: 1
      persistentVolume:
        enabled: true
        size: 50Gi
        storageClass: "longhorn"

    kafka:
      enabled: false

    rollout_operator:
      enabled: false
    gateway:
      enabledNonEnterprise: false
    ruler:
      enabled: false
    overrides_exporter:
      enabled: false
    alertmanager:
      enabled: false
    minio:
      enabled: false

    metaMonitoring:
      dashboards:
        enabled: true
        namespace: grafana
        annotations:
          k8s-sidecar-target-directory: /tmp/dashboards/Mimir Dashboards
      serviceMonitor:
        enabled: true
