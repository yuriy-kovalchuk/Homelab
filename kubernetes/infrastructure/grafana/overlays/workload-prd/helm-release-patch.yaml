apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  values:
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password

    grafana.ini:
      server:
        root_url: "https://grafana.yuriy-lab.cloud"
      news:
        news_feed_enabled: false
      users:
        default_theme: dark
      dashboards:
        default_home_dashboard_path: /tmp/dashboards/Kubernetes/k8s-global.json
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false

    plugins:
      - grafana-lokiexplore-app
      - grafana-metricsdrilldown-app

    sidecar:
      image:
        tag: "2.7.3"
      dashboards:
        enabled: true
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Mimir
            type: prometheus
            uid: mimir-metrics
            access: proxy
            url: http://mimir-query-frontend.mimir.svc.cluster.local:8080/prometheus
            isDefault: true
            version: 1
            editable: true
            jsonData:
              httpHeaderName1: X-Scope-OrgID
            secureJsonData:
              httpHeaderValue1: "anonymous"
          - name: Loki
            type: loki
            uid: loki-datasource
            access: proxy
            url: http://loki-gateway.loki.svc.cluster.local
            isDefault: false
            version: 1
            editable: true
            jsonData:
              httpHeaderName1: X-Scope-OrgID
              timeout: 300
              maxLines: 1000
              derivedFields:
                - name: TraceID
                  matcherRegex: '(?:traceID|trace_id|traceId)=(\w+)'
                  url: "$${__value.raw}"
                  datasourceUid: tempo-datasource
            secureJsonData:
              httpHeaderValue1: "anonymous"
          - name: Tempo
            type: tempo
            uid: tempo-datasource
            access: proxy
            url: http://tempo-query-frontend.tempo.svc.cluster.local:3200
            isDefault: false
            version: 1
            editable: true
            jsonData:
              httpMethod: GET
              serviceMap:
                datasourceUid: mimir-metrics
              nodeGraph:
                enabled: true
              lokiSearch:
                datasourceUid: loki-datasource
              tracesToLogsV2:
                datasourceUid: loki-datasource
                spanStartTimeShift: "-1m"
                spanEndTimeShift: "1m"
                filterByTraceID: true
                filterBySpanID: false
                tags:
                  - key: service.name
                    value: service_name
              tracesToMetrics:
                datasourceUid: mimir-metrics
                spanStartTimeShift: "-1m"
                spanEndTimeShift: "1m"
                tags:
                  - key: service.name
                    value: job
