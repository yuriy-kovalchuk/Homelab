# alloy-receiver accepts OTLP traces from instrumented apps in any namespace
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-alloy-receiver-ingress-otlp
  namespace: k8s-monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: k8s-monitoring-alloy-receiver
      app.kubernetes.io/name: alloy-receiver
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
---
