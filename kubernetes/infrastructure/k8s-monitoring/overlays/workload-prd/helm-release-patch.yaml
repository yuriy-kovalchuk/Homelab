apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: k8s-monitoring
spec:
  values:
    cluster:
      name: workload-prd

    global:
      scrapeInterval: 15s

    destinations:
      loki:
        type: loki
        url: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push
      mimir:
        type: prometheus
        url: http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push
        writeAheadLog:
          maxKeepaliveTime: "24h"
          minKeepaliveTime: "5m"
          truncateFrequency: "2h"
      tempo:
        type: otlp
        url: http://tempo-distributor.tempo.svc.cluster.local:4317
        protocol: grpc

    selfReporting:
      enabled: false

    collectors:
      alloy-logs:
        alloy:
          mounts:
            varlog: true
            dockercontainers: false
          clustering:
            enabled: true
          extraArgs:
            - --disable-reporting
      alloy-singleton:
        alloy:
          extraArgs:
            - --disable-reporting
      alloy-metrics:
        alloy:
          clustering:
            enabled: true
          extraArgs:
            - --disable-reporting
      alloy-receiver:
        alloy:
          extraArgs:
            - --disable-reporting

    telemetryServices:
      kube-state-metrics:
        deploy: true
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
      node-exporter:
        deploy: true
        # extraArgs replaces the chart default array — keep the fs-types-exclude entry
        extraArgs:
          - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs)$
          - --collector.hwmon
          - --collector.thermal_zone
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false

    alloy-operator:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir
      kube-state-metrics:
        metricsTuning:
          includeMetrics:
            - kube_namespace_created
      kubelet:
        metricsTuning:
          useDefaultAllowList: true
          includeMetrics:
            - kubelet_node_name
            - kubernetes_build_info
      cadvisor:
        metricsTuning:
          useDefaultAllowList: true
          dropEmptyImageLabels: true
          keepPhysicalNetworkDevices: []
          keepPhysicalFilesystemDevices: []
          includeMetrics:
            - machine_cpu_cores
            - kubernetes_build_info
            # --- CPU Metrics ---
            - container_cpu_usage_seconds_total
            - container_cpu_user_seconds_total
            - container_cpu_system_seconds_total
            - container_cpu_cfs_periods_total
            - container_cpu_cfs_throttled_periods_total
            - container_cpu_cfs_throttled_seconds_total
            - container_cpu_load_average_10s
            - container_spec_cpu_quota
            - container_spec_cpu_period
            # --- Memory Metrics ---
            - container_memory_working_set_bytes
            - container_memory_usage_bytes
            - container_memory_rss
            - container_memory_cache
            - container_memory_swap
            - container_memory_max_usage_bytes
            - container_memory_failcnt
            - container_memory_failures_total
            - container_oom_events_total
            - container_spec_memory_limit_bytes
            - container_spec_memory_swap_limit_bytes
            # --- Network Metrics ---
            - container_network_receive_bytes_total
            - container_network_receive_packets_total
            - container_network_receive_packets_dropped_total
            - container_network_receive_errors_total
            - container_network_transmit_bytes_total
            - container_network_transmit_packets_total
            - container_network_transmit_packets_dropped_total
            - container_network_transmit_errors_total
            # --- Filesystem & Block I/O Metrics ---
            - container_fs_usage_bytes
            - container_fs_limit_bytes
            - container_fs_reads_bytes_total
            - container_fs_reads_total
            - container_fs_writes_bytes_total
            - container_fs_writes_total
            - container_fs_io_current
            - container_fs_io_time_seconds_total
            - container_fs_inodes_total
            - container_fs_inodes_free
            - container_blkio_device_usage_total

            # --- Process & Runtime Lifecycle Metrics ---
            - container_processes
            - container_threads
            - container_threads_max
            - container_file_descriptors
            - container_start_time_seconds
            - container_last_seen
            - container_tasks_state
      controlPlane:
        enabled: true
      kubeControllerManager:
        enabled: true
      kubeDNS:
        enabled: true
      kubeScheduler:
        enabled: true

    hostMetrics:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir
      linuxHosts:
        enabled: true
        metricsTuning:
          useIntegrationAllowList: true
          includeMetrics:
            - node_hwmon_temp_celsius
            - node_hwmon_temp_max_celsius
            - node_hwmon_temp_crit_celsius
            - node_hwmon_fan_rpm
            - node_hwmon_in_volts
            - node_thermal_zone_temp

    clusterEvents:
      enabled: true
      collector: alloy-singleton
      namespaces: []
      destinations:
        - loki

    nodeLogs:
      enabled: false

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      namespaces: []
      destinations:
        - loki
      labels:
        app_kubernetes_io_name: app.kubernetes.io/name
        instance: app.kubernetes.io/instance
        level: level
        service_name: service.name
        service_namespace: service.namespace
        deployment_environment: deployment.environment
        deployment_environment_name: deployment.environment.name
      structuredMetadata:
        pod: pod
        k8s.pod.name: k8s.pod.name
        service.instance.id: service.instance.id

    applicationObservability:
      enabled: true
      collector: alloy-receiver
      destinations:
        - tempo
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true

    autoInstrumentation:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir
      beyla:
        preset: application
        config:
          data:
            internal_metrics:
              prometheus:
                port: 9091
            prometheus_export:
              port: 19090
              features:
                - application
                - application_service_graph
                - application_span
                - application_host
            otel_traces_export:
              endpoint: http://k8s-monitoring-alloy-receiver.k8s-monitoring.svc.cluster.local:4317
            discovery:
              instrument:
                - k8s_pod_labels:
                    beyla.grafana.com/instrument: "true"
              exclude_instrument:
                - exe_path: "{*alloy*,*otelcol*,*beyla*}"

    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir

    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir

    integrations:
      collector: alloy-metrics
      destinations:
        - mimir
