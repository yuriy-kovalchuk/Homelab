apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    goldilocks.fairwinds.com/enabled: "true"
---
# The open-webui chart ships a copy-app-data init container that runs as root
# and has no configurable security context. Exception is scoped to the minimum
# set of policies that init container violates; the main app container is still
# hardened via containerSecurityContext in the HelmRelease values.
apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: open-webui
  namespace: open-webui
spec:
  matchConditions:
    - name: exclude-open-webui
      expression: "object.metadata.namespace == 'open-webui'"
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
    - kind: ValidatingPolicy
      name: disallow-privilege-escalation
