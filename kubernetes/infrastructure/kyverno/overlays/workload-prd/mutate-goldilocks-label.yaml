apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-goldilocks-enabled-label
spec:
  # don't block namespace operations if the policy errors — labelling is non-critical
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  evaluation:
    # also label namespaces that already exist (matched by matchConstraints)
    mutateExisting:
      enabled: true
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              labels: {"goldilocks.fairwinds.com/enabled": "true"}
            }
          }
