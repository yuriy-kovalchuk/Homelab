apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - HostDevices
        - Sidecar
        - NetworkBindingPlugins
      # 1.9 turns every Beta gate on by default; Template would deploy the
      # virt-template components, which have no network policy or Kyverno
      # exception here and are not used.
      disabledFeatureGates:
        - Template
    network:
      binding:
        passt:
          domainAttachmentType: managedTap
    imagePullPolicy: IfNotPresent
    # SMBIOS of every VM: bahamut's own (Minisforum AI series) instead of
    # KubeVirt / Red Hat, which some games treat as "running in a VM" (read
    # through Wine as the Windows system manufacturer). Cluster-wide: KubeVirt
    # has no per-VM SMBIOS; harmless for the other VMs.
    smbios:
      manufacturer: Micro Computer (HK) Tech Limited
      product: AI Series
      version: "1.0"
      family: AI
      sku: MGF8BSC
    permittedHostDevices:
      pciHostDevices:
        - pciVendorSelector: "1002:1900"
          resourceName: "amd.com/780m"
          externalResourceProvider: false
        - pciVendorSelector: "1002:1640"
          resourceName: "amd.com/780m-audio"
          externalResourceProvider: false
        # bahamut's Radeon AI PRO R9700 and its HDMI/DP audio (each alone in its
        # IOMMU group). virt-handler only offers them while they are bound to
        # vfio-pci, i.e. after kubernetes/hypervisor/gpu-passthrough/r9700/gpu-mode.sh
        # vfio (boot default is amdgpu, DRA gpu.amd.com for strata/llama-cpp).
        - pciVendorSelector: "1002:7551"
          resourceName: "amd.com/r9700"
          externalResourceProvider: false
        - pciVendorSelector: "1002:AB40"
          resourceName: "amd.com/r9700-audio"
          externalResourceProvider: false
        # bahamut's xHCI c7:00.3 (alone in IOMMU group 24): the port with the 8BitDo
        # receiver, plus the MT7925's Bluetooth, unused by the host. Moved to vfio-pci
        # together with the R9700 by gpu-mode.sh; boot driver xhci_hcd.
        - pciVendorSelector: "1022:15B9"
          resourceName: "amd.com/bahamut-xhci"
          externalResourceProvider: false
        # bahamut's MT7925 Wi-Fi (05:00.0, alone in IOMMU group 19, no host
        # driver: bahamut is wired). For the SteamOS VM, whose Deck-style setup
        # insists on Wi-Fi. Moved to vfio-pci with the R9700 by gpu-mode.sh.
        # bahamut's xHCI c9:00.3 (alone in IOMMU group 29): the USB hub with the
        # Razer keyboard (1532:021e) and mouse (1532:005c). Moved to vfio-pci with
        # the R9700 by gpu-mode.sh; boot driver xhci_hcd.
        - pciVendorSelector: "1022:15C0"
          resourceName: "amd.com/bahamut-xhci-input"
          externalResourceProvider: false
        - pciVendorSelector: "14C3:7925"
          resourceName: "mediatek.com/bahamut-wifi"
          externalResourceProvider: false
        # yojimbo's GTX 1070 and its HDMI audio (same IOMMU group). virt-handler
        # only offers them while they are bound to vfio-pci, i.e. after
        # kubernetes/hypervisor/vms/ubuntu-test/gpu-mode.sh vfio (boot default is nvidia).
        # The DRA path (vfio.gpu.nvidia.com) is blocked on Talos, see
        # platform/infra/nvidia-dra-driver/VFIO-TALOS-ISSUES.md.
        - pciVendorSelector: "10DE:1B81"
          resourceName: "nvidia.com/gtx1070"
          externalResourceProvider: false
        - pciVendorSelector: "10DE:10F0"
          resourceName: "nvidia.com/gtx1070-audio"
          externalResourceProvider: false
        # yojimbo's PCH xHCI: handing over the whole controller is the only way a
        # VM can use a keyboard/mouse plugged into the machine (KubeVirt passes PCI
        # devices, not individual USB devices). Alone in IOMMU group 3. Boot driver
        # is xhci_pci; gpu-mode.sh vfio moves it to vfio-pci together with the card.
        # valefor has this exact device ID too, but virt-handler no longer runs
        # on the control planes, so only yojimbo offers it.
        - pciVendorSelector: "8086:A12F"
          resourceName: "intel.com/xhci"
          externalResourceProvider: false
  imagePullPolicy: IfNotPresent
  # All of KubeVirt runs on the workers (hypervisor layer), never the control
  # planes. infra = virt-api, virt-controller, virt-exportproxy; workloads =
  # virt-handler, the per-node agent that offers KVM, so VMs can only be
  # scheduled on the workers. Must include bahamut (Radeon 780M passthrough).
  infra:
    nodePlacement:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
  workloads:
    nodePlacement:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
  workloadUpdateStrategy: {}
