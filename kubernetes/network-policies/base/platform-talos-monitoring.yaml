apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-monitoring
  namespace: talos-monitoring
spec:
  description: "talos-monitoring: Kubernetes API for node/PV discovery, Talos node API (:50000) for hardware collection"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talos-monitoring
  ingress:
    - fromEntities:
        - cluster
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Talos machine API: one client per node IP, dialled directly (not via the
    # load-balanced talos.default.svc endpoint), so this is node-entity egress.
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
