apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strata
  namespace: llm-strata
spec:
  endpointSelector:
    matchLabels:
      app: strata
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: the engine never leaves the cluster (cluster-wide allow-dns
  # already puts every pod in egress default-deny). Downloads happen in the
  # strata-model-download Job (cluster-wide/allow-llm-model-download.yaml).
