apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gpu-dra-driver
  namespace: kube-amd-gpu
spec:
  description: "Kubelet plugin publishes a ResourceSlice per node and watches ResourceClaims, so it needs the API server; everything else it does is over the local kubelet socket"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gpu-dra-driver
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
