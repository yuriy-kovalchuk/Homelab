apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cdi-importer-egress
  namespace: kubevirt-ubuntu-test
spec:
  endpointSelector:
    matchLabels:
      app: containerized-data-importer
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: virt-launcher-egress
  namespace: kubevirt-ubuntu-test
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io: virt-launcher
  egress:
    - toEntities:
        - world
    - toEntities:
        - cluster
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# RDP (xrdp in the guest) on the ubuntu-test-rdp LoadBalancer (10.0.4.51:3389),
# from the trusted VLAN and the Tailscale subnet router only.
# externalTrafficPolicy Local keeps the client address, so these CIDRs match
# the real clients.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ubuntu-test-rdp-ingress
  namespace: kubevirt-ubuntu-test
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io/vm: ubuntu-test
  ingress:
    - fromCIDR:
        - 10.0.5.0/24
        - 10.0.6.10/32
      toPorts:
        - ports:
            - port: "3389"
              protocol: TCP
