apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-egress-to-mimir
  namespace: grafana
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - grafana
          - grafana-sc-dashboard
          - grafana-sc-datasources
  ingress:
    - fromEntities:
        - cluster
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: query-frontend
            app.kubernetes.io/instance: mimir
            io.kubernetes.pod.namespace: mimir
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # query-frontend doesn't serve the ruler's rules API — the "Mimir Ruler"
    # datasource talks to mimir-ruler directly for Grafana's Alerting page.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: ruler
            app.kubernetes.io/instance: mimir
            io.kubernetes.pod.namespace: mimir
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
