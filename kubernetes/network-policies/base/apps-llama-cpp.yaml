apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: llama-cpp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: the engine never leaves the cluster (cluster-wide allow-dns
  # already puts every pod in egress default-deny). Models come from the
  # llama-cpp-model-download Job (cluster-wide/allow-llm-model-download.yaml).
