apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  description: "Forgejo Actions runners (forgejo-runner, forgejo-runner-talos) — poll Forgejo for jobs, DinD sidecar pulls job images/actions/sources from the internet and pushes to Harbor"
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - forgejo-runner
          - forgejo-runner-talos
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
            app: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
