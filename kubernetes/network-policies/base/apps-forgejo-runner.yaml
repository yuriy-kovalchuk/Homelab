apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  description: "Forgejo Actions runner — polls Forgejo for jobs, DinD sidecar pulls job images/actions from the internet"
  endpointSelector:
    matchLabels:
      app: forgejo-runner
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo
            app: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
