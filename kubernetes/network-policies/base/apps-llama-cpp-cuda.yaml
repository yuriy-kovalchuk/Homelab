apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp-cuda
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: llama-cpp-cuda
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: models come from the llama-cpp-cuda-download Job below.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp-cuda-download
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: llama-cpp-cuda-download
  # Hugging Face (huggingface.co + its CDN)
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
