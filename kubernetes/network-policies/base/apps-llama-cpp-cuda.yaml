apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp-cuda
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: llama-cpp-cuda
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: models come from the llama-cpp-cuda-model-download Job
  # (cluster-wide/allow-llm-model-download.yaml).
