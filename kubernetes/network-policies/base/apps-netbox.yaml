apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbox
  namespace: netbox
spec:
  description: "NetBox web, worker and housekeeping — HTTP from the gateway; egress only to its CNPG database and Valkey (no internet, no API server)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: netbox
  ingress:
    - fromEntities:
        - cluster
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: pg-cluster-netbox
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: netbox-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbox-valkey
  namespace: netbox
spec:
  description: "NetBox Valkey — only NetBox pods connect"
  endpointSelector:
    matchLabels:
      app: netbox-valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: netbox
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbox-postgres
  namespace: netbox
spec:
  description: "NetBox CNPG cluster — app connects, operator manages, instance manager reaches the API server"
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: pg-cluster-netbox
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: netbox
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
