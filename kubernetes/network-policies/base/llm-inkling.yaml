apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inkling
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: inkling
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: the engine and its files are in the image, the model on
  # llama-cpp's volume (filled by llama-cpp-model-download).
