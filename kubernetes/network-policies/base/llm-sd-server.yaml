apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sd-server
  namespace: llm-sd-server
spec:
  endpointSelector:
    matchLabels:
      app: sd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
  # No egress block: the server never leaves the cluster (cluster-wide allow-dns
  # already puts every pod in egress default-deny). Downloads happen in the
  # sd-server-model-download Job (cluster-wide/allow-llm-model-download.yaml).
