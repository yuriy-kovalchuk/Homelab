apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nvidia-dra-driver
  namespace: nvidia-dra-driver
spec:
  description: "Kubelet plugin publishes a ResourceSlice per node and watches ResourceClaims, so it needs the API server; everything else it does is over the local kubelet socket"
  endpointSelector:
    matchLabels:
      # release name: the same for the NGC chart (nvidia-dra-driver-gpu) and
      # the k8s-sigs chart (dra-driver-nvidia-gpu), whose name labels differ
      app.kubernetes.io/instance: nvidia-dra-driver-gpu
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
