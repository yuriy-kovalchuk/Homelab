apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  description: "nfd-worker writes NodeFeature objects, nfd-master turns them into node labels, nfd-gc removes stale ones: all through the API server, nothing else"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
