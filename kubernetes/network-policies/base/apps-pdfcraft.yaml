apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pdfcraft
  namespace: pdfcraft
spec:
  description: "Allow pdfcraft to receive traffic from the gateway and cluster (static site, no egress)"
  endpointSelector:
    matchLabels:
      app: pdfcraft
  ingress:
    - fromEntities:
        - cluster
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
