apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strata
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: strata
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No egress block: the engine never leaves the cluster (cluster-wide allow-dns
  # already puts every pod in egress default-deny). Downloads happen in the
  # strata-setup Job below.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strata-setup
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: strata-setup
  # Hugging Face: the GSQ-RCO shards and the MTP layer (Qwen's repo + its CDN)
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
