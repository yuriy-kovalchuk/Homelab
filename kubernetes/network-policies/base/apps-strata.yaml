apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strata
  namespace: llm
spec:
  endpointSelector:
    matchLabels:
      app: strata
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # Hugging Face (model shards + MTP layer) and GitHub (setup.py's llama.cpp /
  # update checks) on first start
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
