apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy
spec:
  interval: 5m
  releaseName: trivy-operator
  chart:
    spec:
      chart: trivy-operator
      version: "0.34.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
