apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: trivy-converter
spec:
  values:
    # Switches the adapter's output (and RBAC) from wgpolicyk8s.io
    # PolicyReport/ClusterPolicyReport to openreports.io Report/ClusterReport —
    # an either/or switch in the chart, not additive. CRDs are already
    # installed via the kyverno chart (openreports.installCrds: true).
    openreports:
      enabled: true
      install: false
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    adapters:
      cisKubeBenchReports:
        enabled: false
      # Per-pod vuln reports are extremely numerous (one per pod/replicaset),
      # which previously blew the adapter's default 2m startup cache-sync
      # deadline. Raised timeout to give it enough time to finish the initial
      # sync instead of leaving image CVEs unconverted.
      vulnerabilityReports:
        enabled: true
        timeout: 10
      # ConfigAuditReports are generated for every K8s resource in every namespace
      # (Deployments, Services, ConfigMaps, Roles…) making them the most numerous
      # type. With the rest of the controllers consuming the startup window, this
      # one never gets its turn before the 2-minute manager deadline.
      configAuditReports:
        enabled: false
      # All remaining enabled adapters start up serially and share the same
      # startup window; the chart default timeout (2) is too tight once 6+
      # controllers are competing for it. Same fix as vulnerabilityReports above —
      # exposedSecretReports was the one observed actually crash-looping on
      # "Could not wait for Cache to sync" before this was raised.
      complianceReports:
        enabled: true
        timeout: 10
      rbacAssessmentReports:
        enabled: true
        timeout: 10
      exposedSecretReports:
        enabled: true
        timeout: 10
      infraAssessmentReports:
        enabled: true
        timeout: 10
      clusterInfraAssessmentReports:
        enabled: true
        timeout: 10
      clusterVulnerabilityReports:
        enabled: true
        timeout: 10
    podSecurityContext:
      fsGroup: 12345
    securityContext:
      runAsUser: 12345
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
