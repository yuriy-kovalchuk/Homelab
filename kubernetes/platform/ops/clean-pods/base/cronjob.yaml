apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-pods
  namespace: clean-pods
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cleanup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: alpine/k8s:1.36.1
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  echo "Cleaning up Failed pods..."
                  kubectl delete pods --all-namespaces --field-selector=status.phase=Failed --ignore-not-found
                  echo "Cleaning up Succeeded pods older than 3600 seconds..."
                  for ns in $(kubectl get ns --no-headers -o custom-columns=":metadata.name"); do
                    kubectl get pods -n "$ns" --field-selector=status.phase=Succeeded -o json \
                      | jq -r '.items[] | select(((now - (.status.startTime | fromdateiso8601)) > 3600)) | .metadata.name' \
                      | xargs -r -n1 kubectl delete pod -n "$ns"
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
