apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: vpa
spec:
  interval: 30m
  releaseName: goldilocks
  chart:
    spec:
      chart: goldilocks
      version: "11.1.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
