apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa
spec:
  values:
    recommender:
      extraArgs:
        # Default 1m: with ~140 VPAs (Goldilocks) that was millions of
        # checkpoint and status PATCHes against the API server.
        recommender-interval: 15m
        # The chart defaults to v: 4 (debug), so it must be overridden here.
        v: "2"
        pod-recommendation-min-cpu-millicores: 15
        pod-recommendation-min-memory-mb: 32
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    updater:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    admissionController:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      certGen:
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          seccompProfile:
            type: RuntimeDefault
