apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-tools
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: gpu-tools
  template:
    metadata:
      labels:
        app: gpu-tools
    spec:
      tolerations:
        - operator: Exists
      hostPID: true
      containers:
        - name: gpu-tools
          image: ubuntu:24.04
          command:
            - bash
            - -c
            - |
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
              apt-get update -qq
              apt-get install -y --no-install-recommends lm-sensors pciutils usbutils libdrm2 nvtop radeontop
              sleep infinity
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
