apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa
spec:
  values:
    recommender:
      extraArgs:
        v: "4"
        pod-recommendation-min-cpu-millicores: 15
        pod-recommendation-min-memory-mb: 32
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    updater:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    admissionController:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      certGen:
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          seccompProfile:
            type: RuntimeDefault
