---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-csi-sidecar
  namespace: longhorn-system
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - csi-attacher
          - csi-provisioner
          - csi-resizer
          - csi-snapshotter
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# Helm hook jobs (pre-upgrade / post-upgrade / uninstall) need the API server
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-helm-hooks
  namespace: longhorn-system
spec:
  endpointSelector:
    matchExpressions:
      - key: job-name
        operator: In
        values:
          - longhorn-pre-upgrade
          - longhorn-post-upgrade
          - longhorn-uninstall
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
