apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  values:
    defaultSettings:
      defaultReplicaCount: 1
    persistence:
      defaultClassReplicaCount: 1
    csi:
      attacher:
        replicaCount: 2
      provisioner:
        replicaCount: 2
      resizer:
        replicaCount: 2
      snapshotter:
        replicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
