apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  values:
    # Tolerate the worker-1 GPU taint: Longhorn must still run there to
    # serve worker-local volumes (longhorn-gpu StorageClass)
    global:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
    defaultSettings:
      defaultReplicaCount: 3
      taintToleration: workload=gpu:NoSchedule
    persistence:
      defaultClassReplicaCount: 3
      # Replicas of the default class only on nodes tagged "always-on"
      # (control planes) so data survives worker-1 shutdowns
      defaultNodeSelector:
        enable: true
        selector: "always-on"
    csi:
      attacher:
        replicaCount: 2
      provisioner:
        replicaCount: 2
      resizer:
        replicaCount: 2
      snapshotter:
        replicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
