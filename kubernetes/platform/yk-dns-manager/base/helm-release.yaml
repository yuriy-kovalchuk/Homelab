apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yk-dns-manager
  namespace: yk-dns-manager
spec:
  interval: 5m
  suspend: false
  chartRef:
    kind: OCIRepository
    name: yk-dns-manager
    namespace: yk-dns-manager
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    dnsProvider:
      provider: opnsense
      upsert: false
      settings:
        base_url: "https://10.0.2.1/api"
        skip_tls_verify: "true"
        default_ttl: "300"
      existingSecret: "dns-manager-provider-credentials"
    metrics:
      service:
        port: 9090
    serviceMonitor:
      enabled: false
      interval: 30s
      namespace: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
