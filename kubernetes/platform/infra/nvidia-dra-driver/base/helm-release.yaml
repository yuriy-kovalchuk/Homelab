apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver
  namespace: nvidia-dra-driver
spec:
  interval: 5m
  # Kept from the NGC chart: the CiliumNetworkPolicy selects pods on
  # app.kubernetes.io/instance, which is this name. The chart name (and with it
  # app.kubernetes.io/name and the object names) changed to dra-driver-nvidia-gpu.
  releaseName: nvidia-dra-driver-gpu
  chart:
    spec:
      chart: dra-driver-nvidia-gpu
      version: "0.5.1"
      sourceRef:
        kind: HelmRepository
        name: dra-driver-nvidia
        namespace: flux-system
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
