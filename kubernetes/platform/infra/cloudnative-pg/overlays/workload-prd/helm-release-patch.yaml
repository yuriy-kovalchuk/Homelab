apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  values:
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 100Mi
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
        # Without this the k8s-sidecar drops the dashboard in the root of
        # /tmp/dashboards, which Grafana renders outside any named folder.
        # Every other dashboard ConfigMap in the cluster carries the same
        # annotation; see kubernetes/observability/grafana/base/kustomization.yaml.
        annotations:
          k8s-sidecar-target-directory: /tmp/dashboards/Storage
