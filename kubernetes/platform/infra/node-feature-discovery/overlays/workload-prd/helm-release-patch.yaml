apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  values:
    # Labels nodes with their hardware (PCI vendor/class, CPU, kernel) as
    # feature.node.kubernetes.io/*. The NVIDIA DRA driver needs it (>= 0.18.2)
    # to place its kubelet plugin on nodes with an NVIDIA GPU (yojimbo).
    #
    # The chart sets no seccomp profile; restrict-seccomp-strict denies that,
    # so every pod gets RuntimeDefault. Only the worker's read-only hostPath
    # mounts (/sys, /proc/swaps, /boot, /usr/lib, /lib, /etc/os-release,
    # features.d) need a Kyverno exception.
    master:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    gc:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    worker:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      # Must also run on the GPU workers (bahamut, yojimbo).
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
