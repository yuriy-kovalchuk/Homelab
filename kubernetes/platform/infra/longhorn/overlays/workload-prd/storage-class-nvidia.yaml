apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nvidia
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  # Data stays on yojimbo (nvidia node tag) next to the GTX 1070 pods — for
  # volumes that are useless without that GPU anyway. No diskSelector: the
  # "vms" disk tag only restricts volumes that ask for it (longhorn-vms).
  nodeSelector: "nvidia"
  dataLocality: "strict-local"
