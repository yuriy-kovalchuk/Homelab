apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-vms
provisioner: driver.longhorn.io
allowVolumeExpansion: true
# VM disks: keep the volume when the VM / DataVolume is deleted
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  # Only yojimbo's disk carries the "vms" node + disk tag, so VM volumes land
  # there and nothing else does (the default classes select "system").
  nodeSelector: "vms"
  diskSelector: "vms"
  dataLocality: "strict-local"
