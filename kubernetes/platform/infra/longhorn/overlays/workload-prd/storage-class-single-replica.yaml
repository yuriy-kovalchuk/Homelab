apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-1r
  annotations:
    # StorageClass parameters are immutable; let Flux recreate it on change
    # instead of failing the whole platform-infra apply.
    kustomize.toolkit.fluxcd.io/force: enabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  # Same placement restriction as the default class — control planes only,
  # so the single copy doesn't land on a worker that may be powered off.
  nodeSelector: "system"
