apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  values:
    # Tolerate the bahamut GPU taint: Longhorn must still run there to
    # serve worker-local volumes (longhorn-gpu StorageClass)
    global:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
    defaultSettings:
      defaultReplicaCount: 3
      taintToleration: workload=gpu:NoSchedule
      replicaAutoBalance: best-effort
      # Every control plane holds the only replica of its longhorn-1r volumes
      # (Loki/Mimir/Tempo ingesters, Mimir store-gateway: one per node, the apps
      # replicate themselves). The default block-if-contains-last-replica keeps
      # the instance-manager PDB at 0 for good, so every drain timed out. This
      # still blocks while that last replica runs, and lets the drain finish once
      # its pod is evicted and the volume detached (upgrades keep EPHEMERAL).
      nodeDrainPolicy: allow-if-replica-is-stopped
    persistence:
      defaultClassReplicaCount: 3
      # Replicas of the default class only on Longhorn nodes tagged "system"
      # (control planes) so data survives worker shutdowns. The tag is set by
      # the node.longhorn.io/default-node-tags annotation in each control
      # plane's Talos config.
      defaultNodeSelector:
        enable: true
        selector: "system"
    csi:
      attacher:
        replicaCount: 2
      provisioner:
        replicaCount: 2
      resizer:
        replicaCount: 2
      snapshotter:
        replicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
