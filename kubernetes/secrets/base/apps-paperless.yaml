apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: paperless-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: paperless
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: paperless/db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-config
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: paperless-config
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: paperless/config
        property: secret_key
    - secretKey: admin_user
      remoteRef:
        key: paperless/config
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: paperless/config
        property: admin_password
    - secretKey: admin_mail
      remoteRef:
        key: paperless/config
        property: admin_mail
