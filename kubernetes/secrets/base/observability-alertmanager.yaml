apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: SLACK_API_URL
      remoteRef:
        key: alertmanager/slack
        property: webhook_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadmans-switch
  namespace: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-deadmans-switch
    creationPolicy: Owner
  data:
    - secretKey: PING_URL
      remoteRef:
        key: alertmanager/deadmans-switch
        property: ping_url
