apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-iscsi-config
  namespace: democratic-csi-iscsi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: truenas-iscsi-secret
    creationPolicy: Owner
  data:
    - secretKey: driver-config-file.yaml
      remoteRef:
        key: democratic-csi-iscsi/config
        property: driver-config-file.yaml
