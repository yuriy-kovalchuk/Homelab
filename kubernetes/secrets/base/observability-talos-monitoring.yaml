apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-monitoring-talosconfig
  namespace: talos-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: talos-monitoring-talosconfig
    creationPolicy: Owner
  data:
    # Direct (non-Omni) os:admin talosconfig, ~/.talos/config-prod. The client
    # cert expires 2027-06-16: renew it and rewrite this Vault entry before then
    # (the pod reloads the file on change, no restart needed).
    - secretKey: config
      remoteRef:
        key: talos-monitoring/talosconfig
        property: config
