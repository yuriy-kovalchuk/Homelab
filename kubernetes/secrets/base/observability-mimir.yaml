apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-credentials
  namespace: mimir
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: mimir-credentials
    creationPolicy: Owner
  data:
    # Key names become env vars consumed via -config.expand-env=true
    - secretKey: access_key_id
      remoteRef:
        key: mimir/s3
        property: access_key
    - secretKey: secret_access_key
      remoteRef:
        key: mimir/s3
        property: secret_key
