apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-config
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: netbox-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret_key: "{{ .secret_key }}"
        # Used to hash API tokens; JSON map of pepper ID → 50+ char secret
        api_token_peppers: '{"1": "{{ .api_token_pepper }}"}'
        # No mail server configured
        email_password: ""
  data:
    - secretKey: secret_key
      remoteRef:
        key: netbox/config
        property: secret_key
    - secretKey: api_token_pepper
      remoteRef:
        key: netbox/config
        property: api_token_pepper
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: netbox-superuser
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        email: "{{ .email }}"
        api_token: "{{ .api_token }}"
  data:
    - secretKey: username
      remoteRef:
        key: netbox/superuser
        property: username
    - secretKey: password
      remoteRef:
        key: netbox/superuser
        property: password
    - secretKey: email
      remoteRef:
        key: netbox/superuser
        property: email
    - secretKey: api_token
      remoteRef:
        key: netbox/superuser
        property: api_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-db
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: netbox-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: netbox
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: netbox/db
        property: password
