apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llm
spec:
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-3
      containers:
        - name: llama-cpp
          securityContext:
            privileged: true
            runAsUser: 0
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --model
            - /models/$(MODEL_FILE)
            - --ctx-size
            - "262144"
            - --n-gpu-layers
            - "-1"
            - --parallel
            - "1"
            - --flash-attn
            - "auto"
            - --cache-type-k
            - "q8_0"
            - --cache-type-v
            - "q8_0"
            - --spec-type
            - "draft-mtp"
            - --spec-draft-n-max
            - "2"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dev-dri
              mountPath: /dev/dri
            - name: sys-bus-pci
              mountPath: /sys/bus/pci
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: sys-bus-pci
          hostPath:
            path: /sys/bus/pci
            type: Directory
