apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  endpointSelector:
    matchLabels:
      app: cloudflared
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: TCP
            - port: "7844"
              protocol: UDP
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # cloudflared connects to each public app's Service directly (not via a
    # gateway — Cilium gateways can't serve in-cluster clients of their own VIP).
    # Add one rule per public app.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: whoami
            app: whoami
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
