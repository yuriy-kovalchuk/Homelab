apiVersion: v1
kind: Service
metadata:
  name: opnsense
  namespace: opnsense
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: opnsense
  namespace: opnsense
subsets:
  - addresses:
      - ip: 10.0.4.1
    ports:
      - name: https
        port: 443
        protocol: TCP
