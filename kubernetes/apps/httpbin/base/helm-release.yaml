apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: httpbin
  namespace: httpbin
spec:
  interval: 5m
  releaseName: httpbin
  chart:
    spec:
      chart: httpbingo
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: estahn
        namespace: flux-system
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
