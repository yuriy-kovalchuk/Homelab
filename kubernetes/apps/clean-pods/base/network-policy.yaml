apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: clean-pods-egress
  namespace: clean-pods
spec:
  description: "Allow the cleanup CronJob to reach the kube-apiserver"
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
