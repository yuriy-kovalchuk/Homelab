apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pdfcraft
  namespace: pdfcraft
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-pdfcraft
  hostnames:
    - "pdfcraft.yuriykovalchuk.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pdfcraft
          port: 80
