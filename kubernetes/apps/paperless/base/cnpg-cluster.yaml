apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster-paperless
  namespace: paperless
spec:
  # 2 so drains do not block: the operator switches the primary over to the
  # other instance instead of a single-instance PDB stopping the eviction.
  instances: 2
  postgresql:
    parameters:
      # Cap WAL a broken replica's slot can pin. Without it a replica that
      # could not rejoin filled the primary's volume and stopped the cluster.
      max_slot_wal_keep_size: "2GB"
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db
      dataChecksums: true
  storage:
    storageClass: truenas-iscsi
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
