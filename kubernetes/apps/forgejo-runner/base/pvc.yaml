apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-docker-lib
  namespace: forgejo-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      # The Strata ROCm image (git.yuriykovalchuk.dev/yuriy/Strata) builds on a
      # ~30 GB rocm/dev -complete base: buildkit's copy plus the exported image
      # need ~70 GB. Can only grow — a PVC request cannot be shrunk.
      storage: 100Gi
