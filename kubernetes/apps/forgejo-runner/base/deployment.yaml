apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  # dockerd's /var/lib/docker is an RWO iSCSI volume: a rolling update would
  # leave the new pod waiting on an attach the old one still holds
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      # Builds run on any worker (bahamut, yojimbo), never on a control plane.
      # The workers carry the gpu taint, so the runner tolerates it; its docker
      # volume is iSCSI on TrueNAS, so it attaches wherever the pod lands. Images
      # that compile CPU code must target their node's CPU explicitly, not the
      # build host's (the Strata Dockerfiles do).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.0
          command:
            - forgejo-runner
            - daemon
            - --config
            - /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: HOME
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            # dockerd creates the socket 0660 root:docker, and the docker:29.8.0-dind
            # image's docker group is gid 2375 — join it so the socket is usable
            # without touching dind's /etc/group at runtime.
            runAsGroup: 2375
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: docker-sock
              mountPath: /var/run/docker-sock
        - name: dind
          image: docker:29.8.0-dind
          args:
            - dockerd
            - -H
            - unix:///var/run/docker-sock/docker.sock
            - -H
            - tcp://127.0.0.1:2375
            - --tls=false
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker
            - name: docker-sock
              mountPath: /var/run/docker-sock
        - name: prune
          image: docker:29.8.0-cli
          command:
            - sh
            - -c
            # Prunes by size, not age: `until=` judges an image by its build date,
            # so it deleted weeks-old bases like rocm/dev the day after every pull,
            # and the CI build cache (driver: docker) is what makes rebuilds fast.
            - |
              while true; do
                sleep 86400
                # leftovers of finished jobs
                docker container prune -f --filter "until=24h"
                docker network prune -f --filter "until=24h"
                docker volume prune -af
                # build cache: keep the most recently used 60 GB
                docker builder prune -af --max-used-space 60gb
                # unused images only once the volume is 80% full
                set -- $(df -P /docker-lib | tail -1)
                used=${5%\%}
                if [ "$used" -ge 80 ]; then
                  docker image prune -af
                fi
              done
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # read-only, only for df
          volumeMounts:
            - name: docker-lib
              mountPath: /docker-lib
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: forgejo-runner-config
        - name: data
          emptyDir: {}
        - name: docker-lib
          persistentVolumeClaim:
            claimName: forgejo-runner-docker-lib
        - name: docker-sock
          emptyDir: {}
