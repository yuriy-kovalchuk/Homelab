apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.1.0
          command:
            - forgejo-runner
            - daemon
            - --config
            - /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: HOME
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            # dockerd creates the socket 0660 root:docker, and the docker:29.8.0-dind
            # image's docker group is gid 2375 — join it so the socket is usable
            # without touching dind's /etc/group at runtime.
            runAsGroup: 2375
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: docker-sock
              mountPath: /var/run/docker-sock
        - name: dind
          image: docker:29.8.0-dind
          args:
            - dockerd
            - -H
            - unix:///var/run/docker-sock/docker.sock
            - -H
            - tcp://127.0.0.1:2375
            - --tls=false
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-lib
              mountPath: /var/lib/docker
            - name: docker-sock
              mountPath: /var/run/docker-sock
        - name: prune
          image: docker:29.8.0-cli
          command:
            - sh
            - -c
            - |
              while true; do
                sleep 86400
                docker system prune -af --volumes --filter "until=72h"
              done
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          secret:
            secretName: forgejo-runner-config
        - name: data
          emptyDir: {}
        - name: docker-lib
          persistentVolumeClaim:
            claimName: forgejo-runner-docker-lib
        - name: docker-sock
          emptyDir: {}
