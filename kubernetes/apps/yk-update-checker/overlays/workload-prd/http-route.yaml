apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yk-update-checker
  namespace: yk-update-checker
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-yk-updates
  hostnames:
    - "yk-updates.yuriykovalchuk.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yk-update-checker
          port: 80
