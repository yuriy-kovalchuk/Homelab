apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yk-update-checker
  namespace: yk-update-checker
spec:
  interval: 5m
  releaseName: yk-update-checker
  chart:
    spec:
      chart: yk-update-checker
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: yk-charts
        namespace: flux-system
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  values:
    scanner:
      config:
        update_type: all
        repos:
          - name: homelab
            repo: https://github.com/yuriy-kovalchuk/homelab
          - name: yk-update-checker
            repo: https://github.com/yuriy-kovalchuk/yk-update-checker
          - name: yk-dns-manager
            repo: https://github.com/yuriy-kovalchuk/yk-dns-manager
          - name: talos-monitoring
            repo: https://github.com/yuriy-kovalchuk/talos-monitoring
          - name: yk-talos-management
            repo: https://github.com/yuriy-kovalchuk/yk-talos-management

    grafana:
      dashboard:
        enabled: true
        folder: Security   # Grafana sidecar folder

    metrics:
      serviceMonitor:
        enabled: true
        interval: 5m
      prometheusRule:
        enabled: true   # default rules: major/unknown warning, minor/patch info, stale scan, failed repo, digest drift
