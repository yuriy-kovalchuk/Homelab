apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yk-update-checker
  namespace: yk-update-checker
spec:
  interval: 5m
  releaseName: yk-update-checker
  chart:
    spec:
      chart: yk-update-checker
      version: "0.3.0-alpha"
      sourceRef:
        kind: HelmRepository
        name: yk-charts
        namespace: flux-system
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  values:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    scanner:

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 512Mi

      config:
        update_type: all
        parallel_checks: 5
        repos:
          - name: homelab
            repo: https://github.com/yuriy-kovalchuk/homelab

    grafana:
      dashboard:
        enabled: true

    metrics:
      serviceMonitor:
        enabled: true
