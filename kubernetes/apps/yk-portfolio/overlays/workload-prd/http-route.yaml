apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yk-portfolio
  namespace: yk-portfolio
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-yk-portfolio
  hostnames:
    - "portfolio.yuriykovalchuk.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yk-portfolio
          port: 80
