apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  values:
    allowedHosts:
      - netbox.yuriykovalchuk.dev
    csrf:
      trustedOrigins:
        - https://netbox.yuriykovalchuk.dev

    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https-netbox
      hostnames:
        - netbox.yuriykovalchuk.dev
