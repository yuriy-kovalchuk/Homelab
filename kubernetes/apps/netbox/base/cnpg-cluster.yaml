apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster-netbox
  namespace: netbox
spec:
  # 2 so drains do not block: the operator switches the primary over to the
  # other instance instead of a single-instance PDB stopping the eviction.
  instances: 2
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
      secret:
        name: netbox-db
      dataChecksums: true
  storage:
    storageClass: truenas-iscsi
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
