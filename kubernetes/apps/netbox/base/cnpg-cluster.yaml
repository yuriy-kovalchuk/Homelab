apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster-netbox
  namespace: netbox
spec:
  instances: 1
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
      secret:
        name: netbox-db
      dataChecksums: true
  storage:
    storageClass: truenas-iscsi
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
