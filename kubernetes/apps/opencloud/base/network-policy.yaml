apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencloud
  namespace: opencloud
spec:
  description: "Allow opencloud to receive traffic from the gateway and cluster"
  endpointSelector:
    matchLabels:
      app: opencloud
  ingress:
    - fromEntities:
        - cluster
        - ingress
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
