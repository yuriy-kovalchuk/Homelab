apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default-store
spec:
  provider:
    vault:
      server: "https://vault.mgmt.yuriy-lab.cloud"
      path: "kubernetes"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
