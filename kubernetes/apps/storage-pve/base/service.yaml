apiVersion: v1
kind: Service
metadata:
  name: storage-pve
  namespace: storage-pve
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8006
      targetPort: 8006
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: storage-pve
  namespace: storage-pve
subsets:
  - addresses:
      - ip: 10.0.3.2
    ports:
      - name: https
        port: 8006
        protocol: TCP
