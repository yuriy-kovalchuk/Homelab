apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster-forgejo
  namespace: forgejo
spec:
  # 2 so drains do not block: the operator switches the primary over to the
  # other instance instead of a single-instance PDB stopping the eviction.
  instances: 2
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db
      dataChecksums: true
  storage:
    storageClass: truenas-iscsi
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
