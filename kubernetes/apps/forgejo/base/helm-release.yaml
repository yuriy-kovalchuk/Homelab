apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      rootless: true

    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    persistence:
      enabled: true
      create: false
      claimName: forgejo-data

    gitea:
      admin:
        existingSecret: forgejo-admin
      config:
        APP_NAME: "Forgejo"
        server:
          SSH_LISTEN_PORT: 2222
          SSH_PORT: 22
          SSH_DOMAIN: git.yuriykovalchuk.dev
          DOMAIN: git.yuriykovalchuk.dev
          ROOT_URL: https://git.yuriykovalchuk.dev
        database:
          DB_TYPE: postgres
          HOST: pg-cluster-forgejo-rw:5432
          NAME: forgejo
          USER: forgejo
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-db
              key: password
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    service:
      ssh:
        type: ClusterIP
        port: 22

    ingress:
      enabled: false
