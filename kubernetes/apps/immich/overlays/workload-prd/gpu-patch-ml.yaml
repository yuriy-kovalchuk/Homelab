apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  template:
    spec:
      # No nodeSelector/toleration: the claim below resolves to the 680M, which
      # lives on controlplane-1, so the scheduler places the pod there.
      resourceClaims:
        - name: gpu
          resourceClaimName: immich-gpu
      containers:
        - name: immich-machine-learning
          env:
            # The 680M is gfx1035 (RDNA2, Rembrandt) — not an officially
            # supported ROCm target, so spoof the nearest one that is, gfx1030.
            # This was 11.0.0 while Immich ran on the gfx1103 780M; it must
            # change with the card.
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"
            # HIP_VISIBLE_DEVICES is gone: the container is handed exactly one
            # GPU, so it is always HIP device 0.
          securityContext:
            # Still uid 0 — Immich writes to the NFS uploads/cache PVCs and
            # changing the runtime uid would change file ownership there.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
