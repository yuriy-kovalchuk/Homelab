apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - http-route.yaml
patches:
  - path: gpu-patch-server.yaml
    target:
      kind: Deployment
      name: immich-server
      namespace: immich
  - path: gpu-patch-ml.yaml
    target:
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
