apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  template:
    spec:
      # Shares the single immich-gpu claim with immich-machine-learning, so
      # both pods land on controlplane-1 and both see the 680M render node
      # (VAAPI transcoding here, ROCm inference there).
      resourceClaims:
        - name: gpu
          resourceClaimName: immich-gpu
      containers:
        - name: immich-server
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
