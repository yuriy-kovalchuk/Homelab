apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: immich-gpu
  namespace: immich
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.amd.com
          allocationMode: ExactCount
          count: 1
          selectors:
            - cel:
                # Radeon 680M (gfx1035, Rembrandt) @ 0000:04:00.0 on
                # controlplane-1. Selects on the sysfs PCI device ID, not
                # productName — amdgpu leaves product_name absent on these
                # cards, so a productName selector matches nothing.
                expression: 'device.attributes["gpu.amd.com"].deviceID == "0x1681"'
