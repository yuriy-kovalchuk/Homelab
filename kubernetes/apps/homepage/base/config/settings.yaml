title: Homelab
description: yuriykovalchuk.dev homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot
target: _blank
useEqualHeights: true
hideVersion: true
disableUpdateCheck: true

# Order and shape of the groups in services.yaml (top to bottom).
layout:
  AI:
    style: row
    columns: 3
  Apps:
    style: row
    columns: 3
  Observability:
    style: row
    columns: 3
  Platform:
    style: row
    columns: 4
  Storage node:
    style: row
    columns: 3
  Infrastructure:
    style: row
    columns: 3
  Dev tools:
    style: row
    columns: 2
