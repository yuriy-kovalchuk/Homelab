# TrueNAS VM on the Proxmox storage node; the apps sit behind its Traefik.
- Storage node:
    - TrueNAS:
        icon: truenas-scale.svg
        href: https://10.0.3.3:8443/ui/
        description: NAS — NFS, SMB, iSCSI
        siteMonitor: https://10.0.3.3:8443/ui/
    - Traefik:
        icon: traefik.svg
        href: https://traefik.yuriykovalchuk.dev
        description: Reverse proxy for the apps below
        siteMonitor: https://traefik.yuriykovalchuk.dev
    - Vault:
        icon: hashicorp-vault.svg
        href: https://vault.yuriykovalchuk.dev
        description: Secrets — synced by External Secrets
        siteMonitor: https://vault.yuriykovalchuk.dev
    - Harbor:
        icon: harbor.svg
        href: https://harbor.yuriykovalchuk.dev
        description: Container registry
        siteMonitor: https://harbor.yuriykovalchuk.dev
    - RustFS:
