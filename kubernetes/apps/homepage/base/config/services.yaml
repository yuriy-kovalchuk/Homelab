# Status sources:
# - Kubernetes services use namespace + app/podSelector: pod state, CPU and
#   memory straight from the API server (no request through the gateway).
#   Workloads parked at replicas 0 (the R9700 ones) show as not running.
# - Everything outside the cluster uses siteMonitor (homepage's egress policy
#   allows world:443/8443/8006 for these).

- AI:
    - Open WebUI:
        icon: open-webui.svg
        href: https://chat.yuriykovalchuk.dev
        description: Chat with the local models
        namespace: open-webui
        app: open-webui
    - Strata:
        icon: mdi-layers-triple
        href: https://strata.yuriykovalchuk.dev
        description: Qwen3.8 Flash-Next — R9700
        namespace: llm
        app: strata
        podSelector: app=strata
    - Image generation:
        icon: mdi-palette
        href: https://sd.yuriykovalchuk.dev
        description: Qwen-Image-2.1 (sd.cpp) — R9700
        namespace: llm
        app: sd-server
        podSelector: app=sd-server
    - llama.cpp Vulkan:
