apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: "Homelab"
    useEqualHeights: true
    theme: dark
    color: slate
    layout:
      GitOps:
        header: true
        style: row
        columns: 2
      Infrastructure:
        header: true
        style: row
        columns: 4
      Monitoring:
        header: true
        style: row
        columns: 4
      AI:
        header: true
        style: row
        columns: 2
      Storage:
        header: true
        style: row
        columns: 2
      Network:
        header: true
        style: row
        columns: 2
      Compute:
        header: true
        style: row
        columns: 2
      Development:
        header: true
        style: row
        columns: 2

  services.yaml: |
    - GitOps:
        - Forgejo:
            icon: gitea.svg
            href: https://forgejo.yuriykovalchuk.dev
            description: Source control
        - Flux:
            icon: flux-cd.svg
            href: https://fluxcd.yuriykovalchuk.dev
            description: GitOps — workload-prd

    - Infrastructure:
        - Vault:
            icon: vault.svg
            href: https://vault.yuriykovalchuk.dev
            description: Secrets management — TrueNAS
        - Zot:
            icon: harbor.svg
            href: https://zot.yuriykovalchuk.dev
            description: Container registry — TrueNAS
        - Longhorn:
            icon: longhorn.svg
            href: https://longhorn.yuriykovalchuk.dev
            description: Persistent storage — workload-prd
        - Dockhand:
            icon: docker.svg
            href: https://dockhand.yuriykovalchuk.dev
            description: Container management — TrueNAS

    - Monitoring:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.yuriykovalchuk.dev
            description: Metrics and dashboards
        - Alloy:
            icon: alloy.svg
            href: https://alloy.yuriykovalchuk.dev
            description: Telemetry collector
        - Hubble:
            icon: cilium.svg
            href: https://hubble.yuriykovalchuk.dev
            description: Cilium network observability
        - Kyverno Reporter:
            icon: kyverno.svg
            href: https://kyverno-reporter.yuriykovalchuk.dev
            description: Policy compliance reporter
        - Goldilocks:
            icon: goldilocks.png
            href: https://goldilocks.yuriykovalchuk.dev
            description: VPA resource recommendations

    - AI:
        - Open WebUI:
            icon: open-webui.svg
            href: https://chat.yuriykovalchuk.dev
            description: Local LLM chat interface
        - Llama.cpp:
            icon: si-meta
            href: https://llama.yuriykovalchuk.dev
            description: Local LLM inference server

    - Storage:
        - TrueNAS:
            icon: truenas-scale.svg
            href: https://truenas.yuriykovalchuk.dev/ui/
            description: NAS storage
        - RustFS:
            icon: minio.svg
            href: https://rustfs.yuriykovalchuk.dev
            description: S3 object storage — TrueNAS
        - Immich:
            icon: immich.png
            href: https://immich.yuriykovalchuk.dev
            description: Photo management — TrueNAS
        - OpenCloud:
            icon: nextcloud.svg
            href: https://opencloud.yuriykovalchuk.dev
            description: File sharing — TrueNAS

    - Network:
        - OPNsense:
            icon: opnsense.svg
            href: https://opnsense.yuriykovalchuk.dev
            description: Firewall and router

    - Compute:
        - Proxmox Storage:
            icon: proxmox.svg
            href: https://storage.pve.yuriykovalchuk.dev
            description: Proxmox — storage node
        - Proxmox Gateway:
            icon: proxmox.svg
            href: https://firewall.yuriykovalchuk.dev:8006
            description: Proxmox — firewall node

    - Development:
        - HTTPBin:
            icon: http.png
            href: https://httpbin.yuriykovalchuk.dev
            description: HTTP testing
        - Whoami:
            icon: traefik.svg
            href: https://whoami.yuriykovalchuk.dev
            description: Request echo service

  widgets.yaml: |
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "workload-prd"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  kubernetes.yaml: |
    mode: cluster

  bookmarks.yaml: |
    - Homelab:
        - GitHub Repo:
            - abbr: HL
              href: https://github.com/yuriy-kovalchuk/Homelab

  docker.yaml: |
    {}

  proxmox.yaml: |
    {}

  custom.css: ""
  custom.js: ""
