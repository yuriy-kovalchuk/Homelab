apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-wildcard-rbac
  annotations:
    policies.kyverno.io/title: Restrict Wildcard RBAC
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: >-
      Audits Roles/ClusterRoles that grant wildcard ('*') apiGroups, resources,
      or verbs. Many cluster-installed operators legitimately need wildcard
      permissions, so this is visibility-only, not a recommendation to remove
      them all. Audit mode: report only.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  validations:
    - expression: >-
        !object.rules.exists(r,
          ('*' in r.verbs) ||
          (has(r.resources) && '*' in r.resources) ||
          (has(r.apiGroups) && '*' in r.apiGroups)
        )
      message: "Role/ClusterRole grants a wildcard apiGroup, resource, or verb."
