apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: propagate-beyla-instrument-label
  annotations:
    policies.kyverno.io/title: Propagate Beyla Instrument Label
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Labels every new Pod in a Namespace labelled
      `beyla.grafana.com/instrument: "true"` with the same label so Beyla
      instruments it.
spec:
  # a missing label must never block pod creation
  failurePolicy: Ignore
  # pods only: no rules for Deployments, StatefulSets, Jobs…
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        beyla.grafana.com/instrument: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              labels: {"beyla.grafana.com/instrument": "true"}
            }
          }
