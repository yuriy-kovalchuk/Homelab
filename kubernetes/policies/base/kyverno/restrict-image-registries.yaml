apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audits container images pulled from registries outside the expected
      allowlist (ghcr.io, quay.io, docker.io — including implicit Docker Hub
      images with no registry host prefix). Helps surface unexpected image
      sources before deciding whether to enforce. Audit mode: report only.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          !c.image.split('/')[0].contains('.') ||
          c.image.startsWith('ghcr.io/') ||
          c.image.startsWith('quay.io/') ||
          c.image.startsWith('docker.io/')
        )
      message: "Image registry is outside the expected allowlist (ghcr.io, quay.io, docker.io)."
