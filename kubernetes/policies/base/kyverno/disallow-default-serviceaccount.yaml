apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audits Pods running under the namespace's 'default' ServiceAccount instead
      of a dedicated one. Useful for spotting workloads that never got a scoped
      identity. Audit mode: report only.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.spec.serviceAccountName) &&
        object.spec.serviceAccountName != '' &&
        object.spec.serviceAccountName != 'default'
      message: "Pod should use a dedicated ServiceAccount rather than 'default'."
