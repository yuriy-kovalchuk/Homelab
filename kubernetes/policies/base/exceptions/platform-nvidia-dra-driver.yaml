apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: nvidia-dra-driver
  namespace: nvidia-dra-driver
spec:
  # The kubelet plugin runs privileged as root, without a seccomp profile, and
  # mounts the kubelet plugin dirs, /var/run/cdi and the driver root.
  matchConditions:
    - name: exclude-nvidia-dra-driver
      expression: "object.metadata.namespace == 'nvidia-dra-driver'"
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities-strict
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-privilege-escalation
    - kind: ValidatingPolicy
      name: disallow-privileged-containers
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
    - kind: ValidatingPolicy
      name: restrict-seccomp-strict
    - kind: ValidatingPolicy
      name: restrict-volume-types
