apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: immich-gpu
  namespace: immich
spec:
  # The Immich containers run as uid 0 so that files on the NFS uploads/cache
  # PVCs keep their ownership. Everything else the baseline asks for is now
  # satisfied by the Deployments themselves — the privileged/hostPath/volume
  # exemptions went away when GPU access moved to a DRA ResourceClaim.
  matchConditions:
    - name: exclude-immich-gpu
      expression: "object.metadata.namespace == 'immich'"
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
