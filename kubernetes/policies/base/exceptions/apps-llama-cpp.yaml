apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: llm
  namespace: llm
spec:
  # The llama.cpp server images run as uid 0; everything else the baseline asks
  # for is now satisfied directly by the Deployments. The privileged/hostPath
  # exemptions this file used to carry are no longer needed — GPU access comes
  # from a DRA ResourceClaim instead of a /dev/dri host mount.
  matchConditions:
    - name: exclude-llm
      expression: "object.metadata.namespace == 'llm'"
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
