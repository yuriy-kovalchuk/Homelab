apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  values:
    openreports:
      enabled: true
      installCrds: true
    reportsServer:
      enabled: false

    admissionController:
      replicas: 1
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    backgroundController:
      replicas: 1
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    cleanupController:
      replicas: 1
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    reportsController:
      replicas: 1
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    features:
      policyExceptions:
        enabled: true
        namespace: "*"
