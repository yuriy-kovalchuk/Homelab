apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  values:
    openreports:
      enabled: true
      installCrds: true
    reportsServer:
      enabled: false

    config:
      # ReplicaSets are excluded from all policy processing by default (chart's
      # baseline resourceFilters), which silently no-ops the empty-ReplicaSet
      # cleanup policy since the resource never reaches policy evaluation.
      resourceFiltersExclude:
        - '[ReplicaSet,*,*]'
        - '[ReplicaSet/?*,*,*]'


    admissionController:
      replicas: 2
      serviceMonitor:
        enabled: true
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: kyverno
    backgroundController:
      replicas: 2
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: background-controller
              app.kubernetes.io/instance: kyverno
    cleanupController:
      replicas: 2
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
              app.kubernetes.io/instance: kyverno
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - apps
              resources:
                - replicasets
              verbs:
                - delete
                - list
                - watch
    reportsController:
      replicas: 2
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: reports-controller
              app.kubernetes.io/instance: kyverno
      rbac:
        clusterRole:
          # The controller is otherwise bound to the built-in `view` role, which
          # deliberately excludes RBAC resources. Without these, restrict-wildcard-rbac
          # cannot start its Role/ClusterRole watchers and stays RBACPermissionsGranted=False.
          extraResources:
            - apiGroups:
                - rbac.authorization.k8s.io
              resources:
                - roles
                - clusterroles
              verbs:
                - get
                - list
                - watch
    features:
      policyExceptions:
        enabled: true
        namespace: "*"
      # Must stay true: it gates report *persistence*, not the report API
      # flavour. With it false the background scan still evaluates every policy
      # but drops the results instead of writing an EphemeralReport, so nothing
      # ever reaches openreports.io and kyverno-reporter shows no policies.
      # openreportsEnabled picks openreports.io *instead of* legacy
      # wgpolicyk8s.io (either/or, not a parallel write), so no extra flag is
      # needed to keep the legacy reports off.
      policyReports:
        enabled: true
      # Native Kubernetes ValidatingAdmissionPolicies only — unrelated to
      # Kyverno's own ValidatingPolicy, and VAP generation is off.
      validatingAdmissionPolicyReports:
        enabled: false
      backgroundScan:
        # Every resource gets a full re-scan each interval, and v1.19 rebuilds the
        # CEL env and recompiles every ValidatingPolicy per resource scanned (no
        # compile cache — see scanner.go ScanResource). CPU therefore scales
        # linearly with this: at 1h the leader sustained ~2 cores, ~95% of it CEL
        # compilation plus the GC it generates. Background scan is the *only*
        # source of reports for ValidatingPolicy (the admission path writes none),
        # so the interval is the safe dial — coverage is unchanged, findings are
        # just up to a day stale.
        backgroundScanInterval: 24h
