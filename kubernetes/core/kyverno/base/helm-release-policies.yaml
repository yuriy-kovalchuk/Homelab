apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: kyverno-policies
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
