apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 5m
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  timeout: 5m
  # Each release Secret is ~0.9 MB; every revision kept sits in etcd and in
  # the API servers' watch cache.
  maxHistory: 2
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
