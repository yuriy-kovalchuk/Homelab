apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ubuntu-test-cloudinit
  namespace: kubevirt-ubuntu-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default-store
    kind: ClusterSecretStore
  target:
    name: ubuntu-test-cloudinit
    creationPolicy: Owner
  data:
    - secretKey: userdata
      remoteRef:
        key: kubevirt-ubuntu-test/cloudinit
        property: userdata
