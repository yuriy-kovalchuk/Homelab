apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-test
  namespace: kubevirt-ubuntu-test
spec:
  runStrategy: Manual
  dataVolumeTemplates:
    - metadata:
        name: ubuntu-test-disk
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
        source:
          http:
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  template:
    metadata:
      labels:
        kubevirt.io/vm: ubuntu-test
    spec:
      # Runs on yojimbo with its GTX 1070 passed through (it tolerates the GPU
      # taint). yojimbo is not always on: with
      # runStrategy Manual the VM simply does not start while it is off. The
      # disk is local to yojimbo: its Longhorn volume was pinned live to the
      # `vms` node/disk tags with 1 replica (like longhorn-vms); the PVC still
      # says `longhorn`, the class it was created with.
      nodeSelector:
        kubernetes.io/hostname: yojimbo
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        devices:
          # KubeVirt permittedHostDevices: only offered while gpu-mode.sh has bound
          # them to vfio-pci (README, GPU passthrough); otherwise the VM stays
          # Pending. The DRA claim (resource-claim-template.yaml, not applied) would
          # replace the card/audio entries once the driver works on Talos
          # (nvidia-dra-driver/VFIO-TALOS-ISSUES.md). xhci is the node's whole USB
          # controller, i.e. the keyboard and mouse plugged into yojimbo itself
          # (README, Local input).
          #
          # PCI slots: KubeVirt has no address field for gpus/hostDevices (only
          # interfaces/disks do), so QEMU places them on root ports in the order they
          # appear here and adding a device shifts every later slot. That is what
          # killed this VM once: the NIC moved (enp1s0 -> enp3s0, netplan stopped
          # matching it, no IP) and the card moved off the BusID the guest's xorg.conf
          # pinned (X died, dark monitor). The guest side therefore matches the NIC by
          # MAC and X takes the only display device there is: the emulated one is off
          # (autoattachGraphicsDevice), so no address is hardcoded anywhere and virtctl
          # vnc is expected to fail. Keep the NIC's pciAddress and macAddress stable;
          # the NIC name in the guest comes from that slot.
          autoattachGraphicsDevice: false
          gpus:
            - name: gtx1070
              deviceName: nvidia.com/gtx1070
          hostDevices:
            - name: gtx1070-audio
              deviceName: nvidia.com/gtx1070-audio
            - name: usb-controller
              deviceName: intel.com/xhci
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          interfaces:
            - name: default
              bridge: {}
              # Pinned PCI address only: it keeps the guest's NIC slot (and therefore
              # its name) stable when devices are added. Do NOT pin macAddress here -
              # with the pod-network bridge binding Cilium keys its KubeVirt datapath
              # off the pod's MAC and a forced VM MAC desynchronizes it, which drops
              # every frame at the k6t bridge (cilium/cilium#21347).
              pciAddress: "0000:01:00.0"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-test-disk
        - name: cloudinit
          cloudInitNoCloud:
            # Matched by name glob, never by MAC or exact slot name: the MAC is
            # re-randomized on every start (see interfaces[] above) and the name follows
            # the PCI slot, so a MAC or exact-name match leaves the link unmanaged and
            # the VM without SSH/RDP. cloud-init only writes this file on first boot, so
            # the same content is already in the image at /etc/netplan/50-cloud-init.yaml.
            networkData: |
              network:
                version: 2
                ethernets:
                  primary:
                    match:
                      name: "e*"
                    dhcp4: true
            secretRef:
              name: ubuntu-test-cloudinit
