apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-test
  namespace: kubevirt-ubuntu-test
spec:
  runStrategy: Manual
  dataVolumeTemplates:
    - metadata:
        name: ubuntu-test-disk
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
        source:
          http:
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  template:
    metadata:
      labels:
        kubevirt.io/vm: ubuntu-test
    spec:
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          interfaces:
            - name: default
              bridge: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-test-disk
        - name: cloudinit
          cloudInitNoCloud:
            networkData: |
              network:
                version: 2
                ethernets:
                  enp1s0:
                    dhcp4: true
            secretRef:
              name: ubuntu-test-cloudinit
