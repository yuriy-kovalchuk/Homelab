apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: radiance-r9700
  namespace: llm-radiance
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # The R9700 (0x7551), shared with strata and llama-cpp:
                  # only one of them holds it, the others stay
                  # Pending until it is scaled to 0.
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x7551"'
