apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiance
  namespace: llm-radiance
spec:
  # Parked at 0 like the other R9700 Deployments (the llm Kustomization ignores
  # /spec/replicas in llm-radiance): scale strata / llama-cpp to 0, then
  # this to 1.
  replicas: 0
  selector:
    matchLabels:
      app: radiance
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radiance
    spec:
      # SIGTERM: the server finishes the step in flight and releases the card.
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radiance
          # radiance 2.3.0 (codeberg.org/StillDeadcode/radiance v2.3.0), the
          # upstream image: kernels for gfx1201. 2.3.0 is the first release that
          # serves Inkling 2 Mini, and only as the IQR-V4 + DFlash2 container
          # (other Inkling containers are refused by name).
          image: docker.io/stilldeadcode/radiance:2.3.0@sha256:7d18847e2ea028de3d9e6306191e05e113c7c5258e3f12026aa14fba91ff2cd7
          args:
            - --config
            - /etc/radiance/radiance.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /etc/radiance
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              # Host side: the container's page cache while it loads, the
              # pinned snapshot store (checkpoint-slots, capped at an eighth of
              # host memory), staging, and the parked model's RAM copy (Qwen
              # 18.7 GB or Inkling 14.4 GB: the two do not fit the card together,
              # so the one not in use parks). Pinned memory is not reclaimable,
              # so the request covers it; sd-server's 20Gi still fits beside it
              # on bahamut's 64 GB.
              memory: 24Gi
            limits:
              cpu: "8"
              # radiance caps its pinned host memory (parked copies included) at
              # 75% of this limit, 30 GiB, and keeps 8 GiB of it free. Without
              # room for a RAM copy a swap reloads the container over iSCSI
              # (minutes) instead of restoring from RAM (seconds).
              memory: 40Gi
          # Loading reads ~19 GB (Qwen) / ~15 GB (Inkling) from the volume and
          # builds the plan; the 27B took 13.5 s from local disk upstream,
          # minutes over iSCSI.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          # /health turns 503 "stuck" once the card has advanced nothing for a
          # minute; the server also exits on its own after 60 s stuck.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: radiance-models
        - name: config
          configMap:
            name: radiance-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
