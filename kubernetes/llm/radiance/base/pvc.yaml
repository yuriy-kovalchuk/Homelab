apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radiance-models
  namespace: llm-radiance
spec:
  # TrueNAS, not longhorn-gpu: bahamut's Longhorn disk is fully scheduled
  # (strata-data 300, forgejo-runner-talos 200, steamos 158, sd-server 50). The
  # engine reads the container once at load (~19 GB, then all of it sits in
  # VRAM), so the network hop only costs load time.
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      # qwen3.8-27b-iq4r-l-v4.rad (18.7 GB) + inkling-2-mini-iq4r-v4.rad
      # (15.5 GB) = 34.2 GB; about 15 GB left for a download in flight.
      storage: 50Gi
