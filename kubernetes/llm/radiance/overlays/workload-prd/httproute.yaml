apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radiance
  namespace: llm-radiance
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-radiance
  hostnames:
    - "radiance.yuriykovalchuk.dev"
  rules:
    # OpenAI (/v1/...), Anthropic (/v1/messages) and llama-server's native
    # routes, plus the dashboard at /.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radiance
          port: 8080
