apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-rocm
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp-rocm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-cpp-rocm
    spec:
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b10689
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --models-dir
            - /models
            - --models-preset
            - /config/presets.ini
            - --models-max
            - "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
        - name: config
          configMap:
            name: llama-cpp-models-preset
