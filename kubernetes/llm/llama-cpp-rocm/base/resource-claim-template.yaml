apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llama-cpp-rocm-r9700
  namespace: llm
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # Same physical card as llama-cpp's claim (R9700, 0x7551).
                  # Two separate claims for one device means exactly one of the
                  # two Deployments can hold it; the other stays Pending.
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x7551"'
