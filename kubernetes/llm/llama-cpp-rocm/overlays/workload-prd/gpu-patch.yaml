apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-rocm
  namespace: llm
spec:
  template:
    spec:
      nodeSelector:
        ai-node: oculink
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: llama-cpp
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          env:
            # Node has two AMD GPUs: R9700 (Navi 48, gfx1201) at PCI 03:00.0 =
            # HIP device 0, and the 780M iGPU at PCI c7:00.0 = HIP device 1.
            # Pin to the R9700 — the 780M (gfx110x) has no kernels in this image.
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            # ROCm 7.2.1 image (server-rocm) ships native gfx1201 kernels, so the
            # R9700 needs NO HSA_OVERRIDE_GFX_VERSION spoof.
          volumeMounts:
            - name: dev-dri
              mountPath: /dev/dri
            - name: dev-kfd
              mountPath: /dev/kfd
      volumes:
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
