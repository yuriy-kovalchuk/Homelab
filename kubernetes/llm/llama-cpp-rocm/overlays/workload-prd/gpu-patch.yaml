apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-rocm
  namespace: llm
spec:
  strategy:
    type: Recreate
  template:
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Claims the R9700 (0x7551) — the same card as llama-cpp. Whichever pod
      # is scheduled first holds it; the other stays Pending until that one is
      # scaled to 0.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-cpp-rocm-r9700
      containers:
        - name: llama-cpp
          # HIP_VISIBLE_DEVICES is gone: the container is given exactly one GPU,
          # so it is always HIP device 0. The ROCm 7.2.1 image ships native
          # gfx1201 kernels, so no HSA_OVERRIDE_GFX_VERSION spoof either.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
