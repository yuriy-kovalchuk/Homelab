apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llama-cpp-igpu-radeon780m
  namespace: llm
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # Radeon 780M iGPU (gfx1103) @ 0000:c7:00.0 on worker-1.
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x1900"'
