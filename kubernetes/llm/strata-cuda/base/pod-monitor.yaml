apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: strata-cuda-gpu
  namespace: llm
spec:
  # Same job label as llama-cpp-cuda's: the Energy dashboard keeps measuring the
  # GTX 1070 whichever of the two holds it.
  selector:
    matchLabels:
      app: strata-cuda
  podMetricsEndpoints:
    - port: gpu-metrics
      path: /metrics
      interval: 30s
      relabelings:
        - replacement: nvidia-gpu
          targetLabel: job
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
