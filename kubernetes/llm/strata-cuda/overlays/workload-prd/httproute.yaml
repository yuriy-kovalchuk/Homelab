apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strata-cuda
  namespace: llm
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-strata-cuda
  hostnames:
    - "strata-cuda.yuriykovalchuk.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: strata-cuda
          port: 8080
