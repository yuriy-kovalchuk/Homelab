apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: strata-r9700
  namespace: llm
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # Same physical card as llama-cpp and llama-cpp-rocm (R9700,
                  # 0x7551): only one of the three can hold it, the others stay
                  # Pending until it is scaled to 0.
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x7551"'
