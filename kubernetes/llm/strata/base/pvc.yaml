apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strata-data
  namespace: llm-strata
spec:
  # 1 replica, strict-local on bahamut: the data is useless without the R9700
  # anyway, and reads stay on the node's NVMe (Strata reads its lookup table per token)
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-gpu
  # The volume made in the old llm namespace (PV set to Retain before the move):
  # binds this claim to it instead of provisioning an empty one.
  volumeName: pvc-5eed3802-0147-49de-92e9-0f595925414c
  resources:
    requests:
      # Bumped from 200Gi when three Qwen3.8-Flash-Next sizes sat side by side
      # (IQ2_XS and IQ3_XXS since deleted; IQ3_S + mtp/packs is ~92 GB). A new
      # size's setup-time disk-space precheck wants ~31 GB free even though the
      # shard-2 copy ends up hardlinked, not duplicated.
      storage: 300Gi
