# Downloads and packs the model the engine serves, so the engine pod itself needs
# no internet egress (network policy is per pod: see network-policies/base/apps-strata.yaml).
#
# Runs the image's entrypoint in STRATA_MODE=setup: GSQ-RCO GGUFs from Hugging
# Face, the MTP layer from Qwen's original repo (pinned revision, SHA-256
# checked), the pack, then /data/config/strata-<model>.json — and exits. With the
# config already there it is a no-op.
#
# Switching models: set MODEL here and push — the force annotation makes Flux
# recreate this immutable Job, which prepares the new model while the engine keeps
# serving the old one. Then set MODEL in deployment.yaml to switch the engine.
apiVersion: batch/v1
kind: Job
metadata:
  name: strata-setup
  namespace: llm
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: strata-setup
    spec:
      restartPolicy: OnFailure
      # strata-data is a strict-local longhorn-gpu volume: its only replica is on
      # worker-1. ReadWriteOnce is per node, so this runs beside the engine pod.
      nodeSelector:
        kubernetes.io/hostname: worker-1
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: harbor.yuriykovalchuk.dev/homelab/strata:82f46a8-gfx1201-rocm7.2.4-2583165
          env:
            - name: STRATA_MODE
              value: setup
            # Being prepared: IQ3_XXS (43 GB experts, 99.4% of BF16 on ISTA's tasks;
            # shard 1 is 47 GB, shard 2 and the MTP layer are shared with IQ2_XS).
            # The engine keeps serving IQ2_XS until deployment.yaml is switched.
            - name: MODEL
              value: IQ3_XXS
            # Baked into the model's config at setup; changing it for a model that
            # is already set up needs REINSTALL=1 here for one run.
            - name: CONTEXT
              value: "131072"
          # No GPU claim: setup only reads the card's arch and VRAM from sysfs, and
          # the engine holds the R9700 anyway.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              # packing streams the GGUF; keep it from crowding the engine's RAM
              memory: 12Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strata-data
