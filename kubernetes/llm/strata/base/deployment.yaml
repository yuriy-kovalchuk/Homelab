apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: llm
spec:
  # Parked at 0 like the other R9700 Deployments (the apps Kustomization ignores
  # /spec/replicas in llm): scale llama-cpp / llama-cpp-rocm to 0, then this to 1.
  replicas: 0
  selector:
    matchLabels:
      app: strata
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: strata
    spec:
      # Grace for the server to stop the engine and unpin ~35 GB of RAM.
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds our --max-context override onto the PVC as a normal writable
        # file instead of mounting the ConfigMap there directly: the engine's
        # auto wrapper does cfg_path.touch() on it every launch (a "most
        # recently used" marker), which fails outright on a read-only
        # ConfigMap subPath mount (ConfigMap volumes can never be writable,
        # no matter how they're mounted). Copying overwrites it fresh on
        # every pod start, so it's still self-healing/declarative -- just one
        # step removed from a live mount.
        - name: seed-model-configs
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              set -eu
              cp /configs/strata-iq2_xs.json /data/config/strata-iq2_xs.json
              cp /configs/strata-iq3_xxs.json /data/config/strata-iq3_xxs.json
              cp /configs/strata-iq3_s.json /data/config/strata-iq3_s.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-configs
              mountPath: /configs
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: strata
          # Built by git.yuriykovalchuk.dev/yuriy/Strata CI (Strata e8ca9af, gfx1201,
          # ROCm 7.2.4, repo 3687328) -- 242 commits ahead of the previous pin
          # (82f46a8), off the multi-stage Dockerfile: 7.58 GB -> 4.20 GB (the
          # first two multi-stage builds, 0659674/7f2dd2e, were missing
          # hipblaslt/hipblas and then their ldconfig cache -- both confirmed
          # fixed via `ldd` against this exact tag before pointing it here).
          image: harbor.yuriykovalchuk.dev/homelab/strata:e8ca9af-gfx1201-rocm7.2.4-3687328
          env:
            # auto: if MODEL has no config yet, run Strata's setup first, then serve.
            # This pod has no internet egress, so setup runs offline on the files
            # strata-download put on /data (it skips shards with a .done marker and
            # reuses the MTP layer): it only packs the model and writes the config.
            # Setup must run here, not in the download Job: it needs the GPU.
            - name: STRATA_MODE
              value: auto
            # Which model to serve. Switch only after strata-download has completed
            # for it (download-job.yaml) — setup cannot download from this pod.
            - name: MODEL
              value: IQ3_S
            # Without an API key Strata only answers Host names it knows (DNS
            # rebinding guard); the gateway and in-cluster names have to be listed.
            - name: STRATA_ALLOWED_HOSTS
              value: strata.yuriykovalchuk.dev,strata,strata.llm,strata.llm.svc,strata.llm.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "4"
              # IQ3_S's shard 1 is 54.8 GB (vs IQ3_XXS's 47 GB) -> resident
              # experts in RAM (pageable on ROCm, STRATA_RESIDENT_PIN=0) scale
              # with it, est. ~46-47 GB, plus the engine and int8 KV past the
              # resident threshold -- bigger again at 180224 ctx than at 131072.
              memory: 52Gi
            limits:
              cpu: "15"
              # worker-1 has ~60 GiB allocatable total (confirmed via `kubectl
              # describe node`) -- this is already most of it; leave ~2 GiB for
              # the node's own pods, not much slack beyond the request estimate.
              memory: 58Gi
          # Loading takes a few minutes; the first start of a newly switched model
          # also packs it (minutes, offline) before the port opens.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strata-data
        - name: model-configs
          configMap:
            name: strata-model-configs
