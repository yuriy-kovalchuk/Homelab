apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: llm-strata
spec:
  # Parked at 0 like the other R9700 Deployments (the apps Kustomization ignores
  # /spec/replicas in the llm namespaces): scale llama-cpp / llama-cpp-rocm to 0, then this to 1.
  replicas: 0
  selector:
    matchLabels:
      app: strata
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: strata
    spec:
      # Grace for the server to stop the engine and unpin ~35 GB of RAM.
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds our --max-context override onto the PVC as a normal writable
        # file instead of mounting the ConfigMap there directly: the engine's
        # auto wrapper does cfg_path.touch() on it every launch (a "most
        # recently used" marker), which fails outright on a read-only
        # ConfigMap subPath mount (ConfigMap volumes can never be writable,
        # no matter how they're mounted). Copying overwrites it fresh on
        # every pod start, so it's still self-healing/declarative -- just one
        # step removed from a live mount.
        - name: seed-model-configs
          image: alpine:3.24.3
          command:
            - sh
            - -c
            - |
              set -eu
              cp /configs/strata-iq3_s.json /data/config/strata-iq3_s.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-configs
              mountPath: /configs
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: strata
          # Built by git.yuriykovalchuk.dev/yuriy/Strata CI (Strata 4b9e05a = v0.2.6,
          # gfx1201, ROCm 7.2.4, repo fef517b). The pinned configs in
          # configmap-model-configs.yaml keep 0.1.x setup's choices -- regenerate one
          # with STRATA_MODE=auto and no seeded file to pick up newer setup defaults.
          image: harbor.yuriykovalchuk.dev/homelab/strata:4b9e05a-gfx1201-rocm7.2.4-fef517b@sha256:a744cf9062dbeba54d63f9f3a0b6347c9cb6e4e2b6a50c46f5efadfc85679301
          env:
            # auto: if MODEL has no config yet, run Strata's setup first, then serve.
            # This pod has no internet egress, so setup runs offline on the files
            # strata-model-download put on /data (it skips shards with a .done marker and
            # reuses the MTP layer): it only packs the model and writes the config.
            # Setup must run here, not in the download Job: it needs the GPU.
            - name: STRATA_MODE
              value: auto
            # Which model to serve (with FAMILY below): the defaults on first apply
            # only. Flux ignores both values (clusters/workload-prd/flux-system/llm.yaml),
            # switch them with `kubectl set env`, see ../README.md. The ignore rule
            # points at env[1] and env[3]: keep this order (kubectl set env edits in
            # place and appends a new name at the end, so the live list matches).
            - name: MODEL
              value: IQ3_S
            # Without an API key Strata only answers Host names it knows (DNS
            # rebinding guard); the gateway and in-cluster names have to be listed.
            - name: STRATA_ALLOWED_HOSTS
              value: strata.yuriykovalchuk.dev,strata,strata.llm-strata,strata.llm-strata.svc,strata.llm-strata.svc.cluster.local
            # qwen = Qwen3.8-Flash-Next (MODEL IQ3_S), qwen36 = Qwen3.6-35B-A3B (MODEL Q8_0)
            - name: FAMILY
              value: qwen
            # Picture reader for the model's config: cpu | gpu | no (see ../README.md).
            # Kept last on purpose -- the Flux ignore rule points at env[1] and env[3].
            # Flux owns this one (not ignored): the reader IQ3_S really serves is the one
            # in its seeded config, so change it and the ConfigMap in the same commit.
            - name: VISION
              value: cpu
            # Exact expert routing, no speed-for-quality trades (after VISION: the
            # Flux ignore rule points at env[1] and env[3]). The engine inherits the
            # pod env; a model config's own "env" would override it.
            # Tail skip is ON by default on gfx1201 whenever some experts are not
            # in VRAM (IQ3_S, Qwen3.6 Q8_0): a missed expert that every token of a
            # verify window routes at rank 7 or lower is neither copied nor computed.
            # Upstream measured teacher-forced KL 0.077 vs off (0.20 on agent text)
            # for +6-15% decode.
            - name: STRATA_ROUTE_TAIL_SKIP
              value: "0"
            # Residency-biased routing (router prefers experts already on the card).
            # Off by default and CUDA-only today, but 0.2.7 once turned it on by
            # itself; pinning 0 keeps a future default from flipping it back.
            - name: STRATA_ROUTE_PRIOR
              value: "0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "4"
              # IQ3_S's shard 1 is 54.8 GB -> resident
              # experts in RAM (pageable on ROCm, STRATA_RESIDENT_PIN=0) scale
              # with it, est. ~46-47 GB, plus the engine and int8 KV past the
              # resident threshold -- bigger again at 256000 ctx than at 131072.
              memory: 52Gi
            limits:
              cpu: "15"
              # bahamut has ~60 GiB allocatable total (confirmed via `kubectl
              # describe node`) -- this is already most of it; leave ~2 GiB for
              # the node's own pods, not much slack beyond the request estimate.
              memory: 58Gi
          # Loading takes a few minutes; the first start of a newly switched model
          # also packs it (minutes, offline) before the port opens.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strata-data
        - name: model-configs
          configMap:
            name: strata-model-configs
