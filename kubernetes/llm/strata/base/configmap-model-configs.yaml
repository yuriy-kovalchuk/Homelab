apiVersion: v1
kind: ConfigMap
metadata:
  name: strata-model-configs
  namespace: llm-strata
data:
  # One key per quant size we've downloaded, each identical to what
  # `STRATA_MODE=auto` setup generated on its own at
  # /data/config/strata-<model>.json except "--max-context" bumped from
  # setup.sh's VRAM-tier default (131072 on this 32 GB card) to 256000 (250k)
  # (trained ceiling is 262144; KV cost there is still small -- ~3.3 GiB
  # combined K+V for the 12 full-attention layers at 256000, see
  # deployment.yaml's initContainer for how each gets seeded onto the PVC).
  # Re-copy a model's block from its real generated file if upstream
  # setup.sh's other defaults for it ever change and this drifts.
  #
  # IQ3_S has no "--kv-resident": KV stays fully VRAM-resident, competing with
  # the expert cache for the same budget, so a bigger context shrinks that cache.
  #
  # "fit_max_tokens": true (also ours, not setup's) clamps a request's
  # max_tokens to the context left after its prompt instead of 400ing.
  # Clients like pi send a fixed max_tokens near the full context, which
  # otherwise fails as soon as the prompt + that exceeds --max-context.
  #
  # The "vision" section is what turns pictures on (see ../README.md): the server
  # starts the reader it names, and "--vision" is in the args so the engine takes
  # image embeddings. Both must exist for the server to start at all: exe in the
  # image (the fork compiles both readers) and mmproj on the volume (models.txt).
  # This one is the CPU reader: threads = bahamut's 8 physical cores and
  # max_tokens = 300 are what setup writes for --vision cpu. The GPU reader
  # instead points at strata-vision-hip, takes max_tokens 1024 and keeps ~1.4 GB
  # of VRAM free (--vram-reserve-mib 700), straight off the expert cache.
  strata-iq3_s.json: |
    {
     "exe": "/opt/strata/engine/strata",
     "args": [
      "--pack",
      "/data/packs/iq3_s",
      "--native",
      "/data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf",
      "--ple-gguf",
      "/data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf",
      "--expert-profile",
      "/opt/strata/data/expert-profile.bin",
      "--expert-cache",
      "auto",
      "--prefill",
      "auto",
      "--spec",
      "4",
      "--spec-min-p",
      "0.5",
      "--mtp",
      "/data/mtp/rt",
      "--max-context",
      "256000",
      "--kv",
      "int8",
      "--vision"
     ],
     "cwd": "/opt/strata",
     "tokenizer": "/data/packs/iq3_s/tokenizer",
     "model_name": "qwen3.8-flash-next-iq3_s",
     "log": "/opt/strata/strata-iq3_s.log",
     "lib_dirs": [
      "/opt/rocm/lib"
     ],
     "port": 8080,
     "backend": "hip",
     "env": {
      "STRATA_HIPBLASLT_TUNING": "/opt/strata/tools/hip/gfx1201-hipblaslt-100202.txt"
     },
     "vision": {
      "exe": "/opt/strata/engine/strata-vision",
      "mmproj": "/data/models/mmproj-Qwen3.8-Flash-Next-BF16.gguf",
      "model": "/data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf",
      "gpu": false,
      "threads": 8,
      "max_tokens": 300
     },
     "gpu": 0,
     "gpus_asked": true,
     "host": "0.0.0.0",
     "fit_max_tokens": true
    }
