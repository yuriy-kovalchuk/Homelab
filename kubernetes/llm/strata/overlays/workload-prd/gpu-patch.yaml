apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: llm
spec:
  template:
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Claims the R9700 (0x7551), which pins the pod to worker-1.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: strata-r9700
      containers:
        - name: strata
          # No privileged/hostPath: the DRA driver injects /dev/kfd and this
          # card's render node via CDI. No IPC_LOCK either: on ROCm setup.py keeps
          # the expert copy pageable, and the PLE table's mlock failing under the
          # 8 MiB container memlock limit is only a warning in the engine log.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
