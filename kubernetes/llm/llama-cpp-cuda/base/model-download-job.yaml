# Downloads the models in MODELS onto llama-cpp-cuda-models (yojimbo). Each
# line is "<repo> <file> [<saved as>]"; the mmproj files share a name across
# repos, so they are saved under a per-model name that presets.ini points at.
# Finished files get a .done marker and are skipped on the next run.
#
# Adding a model: append it here and add its section to
# models-preset-configmap.yaml, then push (force: Flux recreates this
# immutable Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-cuda-download
  namespace: llm
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: llama-cpp-cuda-download
    spec:
      restartPolicy: OnFailure
      # strict-local volume: its only replica is on yojimbo.
      nodeSelector:
        kubernetes.io/hostname: yojimbo
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: alpine:3.21
          env:
            - name: MODELS
              value: |
                unsloth/gemma-4-12B-it-qat-GGUF gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
                unsloth/gemma-4-12B-it-qat-GGUF mmproj-F16.gguf mmproj-gemma-4-12B-it-qat-F16.gguf
                unsloth/gemma-4-E4B-it-GGUF gemma-4-E4B-it-Q8_0.gguf
                unsloth/gemma-4-E4B-it-GGUF mmproj-F16.gguf mmproj-gemma-4-E4B-it-F16.gguf
                unsloth/gemma-4-E2B-it-GGUF gemma-4-E2B-it-Q8_0.gguf
                unsloth/gemma-4-E2B-it-GGUF mmproj-F16.gguf mmproj-gemma-4-E2B-it-F16.gguf
          command:
            - sh
            - -c
            - |
              set -eu
              echo "$MODELS" | while read -r repo file name; do
                [ -n "$repo" ] || continue
                out="/models/${name:-$file}"
                if [ -f "$out.done" ]; then
                  echo "[SKIP] $out"; continue
                fi
                echo "[DL] $repo/$file -> $out"
                wget -c -O "$out.part" "https://huggingface.co/$repo/resolve/main/$file"
                mv -f "$out.part" "$out"
                date '+%Y-%m-%d %H:%M' > "$out.done"
                echo "[OK] $out"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-cuda-models
