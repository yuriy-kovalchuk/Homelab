apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
namePrefix: llama-cpp-cuda-
resources:
  - ../../../model-download/base
configMapGenerator:
  - name: model-download-list
    files:
      - models.txt
patches:
  - target:
      kind: Job
      name: model-download
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: llama-cpp-cuda-models
      # llama-cpp-cuda-models is strict-local: its only replica is on yojimbo, and RWO is per node.
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: yojimbo
