apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-cuda
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp-cuda
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-cpp-cuda
    spec:
      containers:
        - name: llama-cpp
          # CUDA 12 build: CUDA 13 dropped Pascal (sm_61, the GTX 1070).
          image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11870
          # Router mode: every model on the volume (filled by the
          # llama-cpp-cuda-download Job) is loaded on demand, one at a time.
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --models-dir
            - /models
            - --models-preset
            - /config/presets.ini
            - --models-max
            - "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              # E2B/E4B keep their per-layer embeddings (up to 3 GB) in host RAM.
              memory: 12Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
        # GPU power, utilisation, memory and temperature (nvidia_smi_*) for the
        # Energy dashboard. It shares the pod's GPU claim (overlay), which is the
        # only way to reach the card: DRA claims are exclusive, and CDI injects
        # nvidia-smi and the driver libraries into every container that uses it.
        # It stops with the pod, so the GTX 1070 is only measured while this runs.
        - name: gpu-exporter
          image: utkuozdemir/nvidia_gpu_exporter:1.15.1
          ports:
            - name: gpu-metrics
              containerPort: 9835
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9835
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-cuda-models
        - name: config
          configMap:
            name: llama-cpp-cuda-models-preset
