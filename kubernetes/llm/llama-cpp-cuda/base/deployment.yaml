apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-cuda
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp-cuda
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-cpp-cuda
    spec:
      containers:
        - name: llama-cpp
          # CUDA 12 build: CUDA 13 dropped Pascal (sm_61, the GTX 1070).
          image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10689
          # Router mode: every model on the volume (filled by the
          # llama-cpp-cuda-download Job) is loaded on demand, one at a time.
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --models-dir
            - /models
            - --models-preset
            - /config/presets.ini
            - --models-max
            - "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              # E2B/E4B keep their per-layer embeddings (up to 3 GB) in host RAM.
              memory: 12Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-cuda-models
        - name: config
          configMap:
            name: llama-cpp-cuda-models-preset
