# Qwen3.6-35B-A3B-GSQ-hybrid-MTP.gguf: the GSQ-hybrid file with Unsloth's MTP draft
# block appended (merge_mtp.py), so llama.cpp can run --spec-type draft-mtp and
# strata-poly finds the block in the model's own file. Reads the two inputs on the
# volume (the block comes from strata-cuda's draft-block Job), needs no network.
# Idempotent: an output whose SHA-256 matches is kept.
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-cuda-mtp-merge
  namespace: llm
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # retries until the draft block exists (strata-cuda-draft-cut)
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      # llama-cpp-cuda-models is strict-local on yojimbo
      nodeSelector:
        kubernetes.io/hostname: yojimbo
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: merge
          image: python:3.13.18-alpine3.24
          command:
            - python3
            - -I
            - /scripts/merge_mtp.py
            - /models/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
            - /models/Qwen3.6-35B-A3B-MTP-draft.gguf
            - /models/Qwen3.6-35B-A3B-GSQ-hybrid-MTP.gguf
          env:
            # as pinned in model-download/models.txt
            - name: MODEL_SHA256
              value: 8e50912f5d0703401ca21b09deb2ee8a84d03536ade6fb44815fcb40a0b03596
            # as pinned in strata-cuda/base/draft-block/job.yaml
            - name: DRAFT_SHA256
              value: d4890d88e0f143951b5358dda9dd6f1d2727113f6de13faa5bfdbacaa51765b1
            # of the merged file (11.68 GiB, first written 2026-11-06)
            - name: OUT_SHA256
              value: 3b757b1b51fe48ceb07ab9852c314a2e345fefb0ac5d38ba61e4e8dc394bbd36
          # Root: the volume belongs to uid 0 (the llm PolicyException covers it).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-cuda-models
        - name: scripts
          configMap:
            name: llama-cpp-cuda-mtp-merge
