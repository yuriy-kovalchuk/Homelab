apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-cuda-models
  namespace: llm
spec:
  # 1 replica, strict-local on yojimbo: the shared llama-cpp-models volume has
  # its only replica on bahamut, which is often off.
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-nvidia
  resources:
    requests:
      # 50 -> 70Gi (2026-11-06): room for the GSQ-hybrid file with the MTP block
      # merged in (Qwen3.6-35B-A3B-GSQ-hybrid-MTP.gguf) beside the original.
      storage: 70Gi
