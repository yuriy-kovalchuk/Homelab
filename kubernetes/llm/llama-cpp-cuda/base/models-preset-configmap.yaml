apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-cuda-models-preset
  namespace: llm
data:
  # GTX 1070: 8 GiB VRAM, Pascal. Gemma 4's per-layer embeddings (E2B/E4B) and
  # input token embeddings stay in host RAM, so VRAM use is below file size.
  # Section name = file name without .gguf (llama-server router mode).
  presets.ini: |
    version = 1

    [*]
    n-gpu-layers = -1
    c = 32768
    flash-attn = on
    cache-type-k = q8_0
    cache-type-v = q8_0
    parallel = 1
    ; No host-RAM prompt cache (default 8 GiB) and few context checkpoints
    ; (default 32): both grow with every request, and in this 12Gi pod they
    ; evict the mmapped MoE experts, which are then re-read from disk per token
    ; (Qwen fell to 1-2 tok/s). Follow-up turns of the same chat still reuse KV.
    cache-ram = 0
    ctx-checkpoints = 4
    load-on-startup = false
    stop-timeout = 60
    ; Gemma 4 defaults (model card / GGUF general.sampling)
    temp = 1.0
    top-p = 0.95
    top-k = 64

    ; 12B QAT, ~6.7 GB on the GPU: the biggest that fits. Smaller ubatch keeps
    ; the 262k-vocab logits buffer inside the ~1 GB left for KV + compute.
    [gemma-4-12B-it-qat-UD-Q4_K_XL]
    ubatch-size = 256
    mmproj = /models/mmproj-gemma-4-12B-it-qat-F16.gguf

    ; E4B Q8_0: 8.2 GB file, ~5.2 GB on the GPU (3 GB of per-layer embeddings in RAM)
    [gemma-4-E4B-it-Q8_0]
    mmproj = /models/mmproj-gemma-4-E4B-it-F16.gguf

    ; E2B Q8_0: 5 GB file, ~2.6 GB on the GPU
    [gemma-4-E2B-it-Q8_0]
    c = 131072
    mmproj = /models/mmproj-gemma-4-E2B-it-F16.gguf

    ; Qwen3.6-35B-A3B, 2-bit GSQ (ISTA-DASLab) as GGUF: routed experts Q2_0
    ; (~8.5 GB), attention/shared experts/LM head Q8_0, 12.2 GB file. The experts
    ; are small enough that all of them stay in RAM (n-cpu-moe 40) and the free
    ; VRAM is a MoE cache (llama.cpp #29887) of hot experts; only misses cross
    ; PCIe. Measured on b12019, 4.7k-token prompt + 512 generated, after 30
    ; sustained requests (decode / prompt t/s, VRAM):
    ;   IQ3_XXS, n-cpu-moe 25, no cache    21.0 / 556  7.7 GB  (previous model)
    ;   IQ3_XXS, n-cpu-moe 33, cache 2200  26.2 / 549  7.9 GB  (RAM-bound, 33 layers max)
    ;   GSQ, 131k, cache 3700              32.1 / 624  7.7 GB  <- this
    ;   GSQ, 262k, ubatch 1024, cache 2600 28.5 / 453  7.4 GB  (full trained context)
    ; GSM8K (first 30, no thinking): 29/30 for both; the miss is the same
    ; ambiguous question running out of tokens. Model card: GSQ is 0-4 points
    ; below BF16 (AIME25 93.3 = BF16, GPQA 80.3 vs 83.8, MMLU-Pro 81.0 vs 84.9).
    ; More context: c 262144 needs ubatch-size 1024 and moe-cache-mib 2600
    ; (the 2048 ubatch compute buffer is 1.9 GB at 262k).
    [Qwen3.6-35B-A3B-GSQ-hybrid]
    c = 131072
    n-cpu-moe = 40
    moe-cache-mib = 3700
    batch-size = 2048
    ubatch-size = 2048
    cache-type-k = q4_0
    cache-type-v = q4_0
    reasoning-budget = 8192
    n-predict = 32768
    temp = 0.7
    top-k = 20
    top-p = 0.8
    min-p = 0.0
    presence-penalty = 0.0
    repeat-penalty = 1.0
