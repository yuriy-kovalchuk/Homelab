apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-cuda-models-preset
  namespace: llm
data:
  # GTX 1070: 8 GiB VRAM, Pascal. Gemma 4's per-layer embeddings (E2B/E4B) and
  # input token embeddings stay in host RAM, so VRAM use is below file size.
  # Section name = file name without .gguf (llama-server router mode).
  presets.ini: |
    version = 1

    [*]
    n-gpu-layers = -1
    c = 32768
    flash-attn = on
    cache-type-k = q8_0
    cache-type-v = q8_0
    parallel = 1
    load-on-startup = false
    stop-timeout = 60
    ; Gemma 4 defaults (model card / GGUF general.sampling)
    temp = 1.0
    top-p = 0.95
    top-k = 64

    ; 12B QAT, ~6.7 GB on the GPU: the biggest that fits. Smaller ubatch keeps
    ; the 262k-vocab logits buffer inside the ~1 GB left for KV + compute.
    [gemma-4-12B-it-qat-UD-Q4_K_XL]
    ubatch-size = 256
    mmproj = /models/mmproj-gemma-4-12B-it-qat-F16.gguf

    ; E4B Q8_0: 8.2 GB file, ~5.2 GB on the GPU (3 GB of per-layer embeddings in RAM)
    [gemma-4-E4B-it-Q8_0]
    mmproj = /models/mmproj-gemma-4-E4B-it-F16.gguf

    ; E2B Q8_0: 5 GB file, ~2.6 GB on the GPU
    [gemma-4-E2B-it-Q8_0]
    c = 131072
    mmproj = /models/mmproj-gemma-4-E2B-it-F16.gguf

    ; Qwen3.6-35B-A3B UD-IQ3_XXS (13.2 GB, MoE, 3B active): the settings measured
    ; on a GTX 1070 Ti in https://unbiasedbob.com/8gb-coding/ (~25 tok/s, ~400 tok/s
    ; prompt, ~10 GB of RAM; 80.6% on its 86-task coding bench vs 77.5% for IQ2_M).
    ; MoE cache (llama.cpp #29887): all 40 layers' routed experts stay in RAM and
    ; the VRAM the 15 GPU expert layers used (~4.5 GB) becomes an SLRU cache of
    ; hot experts across every layer; decode runs them on the GPU, only misses are
    ; uploaded. Upstream measured -cmoe + cache well ahead of split layers. Tune
    ; moe-cache-mib against the hit rate in the log; if it runs out of VRAM, lower
    ; it first, then c to 65536. Fallback: n-cpu-moe = 25 without the cache.
    [Qwen3.6-35B-A3B-UD-IQ3_XXS]
    c = 131072
    n-cpu-moe = 40
    moe-cache-mib = 4096
    batch-size = 2048
    ubatch-size = 2048
    cache-type-k = q4_0
    cache-type-v = q4_0
    reasoning-budget = 8192
    n-predict = 32768
    temp = 0.7
    top-k = 20
    top-p = 0.8
    min-p = 0.0
    presence-penalty = 0.0
    repeat-penalty = 1.0
