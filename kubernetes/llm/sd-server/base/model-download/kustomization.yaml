apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-sd-server
namePrefix: sd-server-
resources:
  - ../../../model-download/base
configMapGenerator:
  - name: model-download-list
    files:
      - models.txt
patches:
  - target:
      kind: Job
      name: model-download
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: sd-server-models
      # sd-server-models is strict-local: its only replica is on bahamut, and RWO is per node.
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: bahamut
