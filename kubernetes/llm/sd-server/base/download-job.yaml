# Downloads the Qwen-Image-2.1 weights onto sd-server-models so the server pod
# (which has no internet egress, see network-policies/base/apps-sd-server.yaml)
# only ever reads them from the volume. Plain HTTPS, so a plain image.
#
# Each file is checked against its Hugging Face LFS SHA-256 and gets a `.done`
# marker; a rerun skips files that already have one. Files land where
# deployment.yaml's args expect them:
#   /models/diffusion_models/qwen-image-2.1-UC-Q8_0.gguf
#   /models/text_encoders/Qwen3VL-8B-Instruct-Q8_0.gguf      (+ mmproj, for edits)
#   /models/vae/qwen_image_2.1_vae_bf16.safetensors
#
# The int8_convrot text encoder is kept on disk for the CPU text-encoder
# fallback: ggml-vulkan crashes (SIGBUS, libggml-vulkan.so+0x6239f) running it
# on RADV. The GGUF one is the same Qwen3-VL-8B-Instruct (the abenzerps int8 file
# is byte-identical to Comfy-Org's stock one), published by Qwen as Q8_0.
#
# Adding a file: add its line to FILES (pinned resolve URL + sha256 from the HF
# tree API at that revision), push (force: Flux recreates this immutable Job),
# wait for it to complete, then point the args in deployment.yaml at it.
apiVersion: batch/v1
kind: Job
metadata:
  name: sd-server-download
  namespace: llm
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: sd-server-download
    spec:
      restartPolicy: OnFailure
      # sd-server-models is a strict-local longhorn-gpu volume: its only replica
      # is on worker-1. ReadWriteOnce is per node, so this runs beside the server.
      nodeSelector:
        kubernetes.io/hostname: worker-1
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: alpine:3.21
          env:
            # Pinned revisions of the two source repos.
            - name: ABENZERPS
              value: https://huggingface.co/abenzerps/Qwen-Image-2.1-Uncensored-GGUF/resolve/6b34e59458d3eb7ba6a6f86a116aed5253dc02c3
            - name: QWEN3VL
              value: https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/f982a07559d4a2f6c8744d840bf6fccab30eea96
            # <URL> <sha256> <directory under /models>
            - name: FILES
              value: |
                $ABENZERPS/qwen-image-2.1-UC-Q8_0.gguf cde456c72ea3ecebfc1be783300e972711d875e0c5f1bed33d42b66b156affa8 diffusion_models
                $ABENZERPS/text_encoders/qwen3vl_8b_int8_convrot.safetensors 8bfd0f6e12abf2d2d697ecc888e5e90b0d6741d6708f05799f53afa560452e8f text_encoders
                $ABENZERPS/vae/qwen_image_2.1_vae_bf16.safetensors bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9 vae
                $QWEN3VL/Qwen3VL-8B-Instruct-Q8_0.gguf 0d264b3941185d00a74f75c4245521dae088ff1efc90ab8d1754e83f5844adb0 text_encoders
                $QWEN3VL/mmproj-Qwen3VL-8B-Instruct-F16.gguf ca524100ebf825c9a870db1c580d03879e0da0ab2541697e2458e64891cf9d38 text_encoders
          command:
            - sh
            - -c
            - |
              set -eu
              echo "$FILES" | while read -r url sha dir; do
                [ -n "$url" ] || continue
                url=$(eval echo "$url")
                f="/models/$dir/$(basename "$url")"
                mkdir -p "/models/$dir"
                if [ -f "$f.done" ]; then
                  echo "[SKIP] $f already downloaded"; continue
                fi
                echo "[DL] $url"
                wget -c -O "$f.part" "$url"
                echo "$sha  $f.part" | sha256sum -c -
                mv -f "$f.part" "$f"
                date '+%Y-%m-%d %H:%M' > "$f.done"
                echo "[OK] $f"
              done
              echo "all files present"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: sd-server-models
