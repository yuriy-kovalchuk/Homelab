apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: sd-server-radeon780m
  namespace: llm-sd-server
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # Radeon 780M iGPU (gfx1103) on bahamut; sd-server is its
                  # only user (the KubeVirt passthrough entry for it is unused).
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x1900"'
