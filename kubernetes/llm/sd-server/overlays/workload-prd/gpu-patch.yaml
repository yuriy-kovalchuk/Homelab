apiVersion: apps/v1
kind: Deployment
metadata:
  name: sd-server
  namespace: llm-sd-server
spec:
  template:
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Claims the 780M iGPU (0x1900), which pins the pod to bahamut and leaves
      # the R9700 to the chat models, so images and chat run at the same time.
      # Much slower than the R9700: for fast images, switch to sd-server-r9700
      # (0x7551, exclusive with strata / llama-cpp / llama-cpp-rocm) and lower
      # the memory in base/deployment.yaml back to 4Gi / 24Gi.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: sd-server-radeon780m
      containers:
        - name: sd-server
          # No privileged/hostPath: the DRA driver injects this card's render
          # node via CDI, which is all Vulkan (RADV) needs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
