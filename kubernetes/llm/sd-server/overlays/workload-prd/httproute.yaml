apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sd-server
  namespace: llm
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-sd
  hostnames:
    - "sd.yuriykovalchuk.dev"
  rules:
    # Web UI at /, plus the OpenAI (/v1), A1111 (/sdapi/v1) and native
    # (/sdcpp/v1) APIs.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sd-server
          port: 1234
