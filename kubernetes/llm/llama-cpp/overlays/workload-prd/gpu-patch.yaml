apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llm
spec:
  # Mandatory with DRA: a RollingUpdate would deadlock, because the incoming
  # pod cannot be allocated the GPU until the outgoing pod releases it.
  strategy:
    type: Recreate
  template:
    spec:
      # The claim below pins the pod to whichever node holds the R9700, so no
      # nodeSelector is needed — but worker-1's taint still has to be tolerated.
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-cpp-r9700
      containers:
        - name: llama-cpp
          # No privileged/hostPath: the DRA driver injects /dev/kfd and this
          # card's render node via CDI, and nothing else.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            claims:
              - name: gpu
