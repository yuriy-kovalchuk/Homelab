apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
namePrefix: llama-cpp-
resources:
  - ../../../model-download/base
configMapGenerator:
  - name: model-download-list
    files:
      - models.txt
patches:
  - target:
      kind: Job
      name: model-download
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: llama-cpp-models
