apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: llm
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: model-downloader
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65532
      containers:
        - name: downloader
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              download() {
                local url="$1"
                local file dir dest tmp
                file="$(basename "$url")"

                # split GGUF (name-00001-of-00003.gguf) -> own subdir so the
                # router loads the shards as one model; single files stay flat
                case "$file" in
                  *-[0-9][0-9][0-9][0-9][0-9]-of-[0-9][0-9][0-9][0-9][0-9].gguf)
                    dir="/models/${file%-[0-9][0-9][0-9][0-9][0-9]-of-[0-9][0-9][0-9][0-9][0-9].gguf}"
                    ;;
                  *)
                    dir="/models"
                    ;;
                esac
                mkdir -p "$dir"
                dest="$dir/$file"
                tmp="$dir/$file.tmp"

                if [ -f "$dest" ]; then
                  echo "[SKIP] $file already present"
                  return 0
                fi

                echo "[DL] $file from $url"
                local resume=""
                [ -f "$tmp" ] && resume="-c"

                if ! wget $resume -O "$tmp" "$url"; then
                  echo "[FAIL] $file download failed — partial kept at $tmp, will resume next run"
                  return 1
                fi

                mv "$tmp" "$dest"
                echo "[OK] $file"
              }

              while IFS= read -r url; do
                case "$url" in
                  ''|'#'*) continue ;;
                esac
                download "$url"
              done < /config/models.txt
          volumeMounts:
            - name: models
              mountPath: /models
            - name: model-list
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
        - name: model-list
          configMap:
            name: llama-cpp-model-list
