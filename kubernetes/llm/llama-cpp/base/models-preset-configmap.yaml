apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-models-preset
  namespace: llm
data:
  presets.ini: |
    version = 1

    ; Global defaults applied to all models
    [*]
    n-gpu-layers = -1

    ; --- Add a section per model file (name = filename without .gguf) ---

    ; Inkling-2-Mini UD-Q4_K_XL (Unsloth, mainline layout). 24 layers, only 4 of
    ; them global attention (the rest a 1024-token sliding window); the middle 12
    ; run 3x, so at most 8 global KV caches: ~4.3 GiB of q8_0 KV at 262k context.
    ; 16.4 GiB weights + 0.6 mmproj + KV + compute fit the R9700's 32 GB. The
    ; native 1M context would need ~17 GiB of KV and does not fit.
    ; Not UD-Q8_K_XL: it keeps the trunk in BF16 with NVFP4 experts, which
    ; b12627's Vulkan backend runs slowly (17 tok/s decode, 2026-11-22); this
    ; file is K-quants, which have tuned (RDNA4) Vulkan kernels.
    ; Sampling: the model card's (temp 1.0, no truncation). Its embedded chat
    ; template takes reasoning_effort (none..max or 0.0-0.99, default 0.9) and
    ; rejects the `developer` role. No speculative decoding: its DSpark drafter
    ; is not in mainline llama.cpp (#32218), and it has no MTP head.
    [Inkling-2-Mini-UD-Q4_K_XL]
    c = 262144
    cont-batching = true
    parallel = 1
    flash-attn = on
    cache-type-k = q8_0
    cache-type-v = q8_0
    mmproj = /models/mmproj-Inkling-2-Mini-F16.gguf
    load-on-startup = false
    stop-timeout = 60
    temp = 1.0
    top-p = 1.0
    top-k = 0
    min-p = 0.00
    presence-penalty = 0.0
