apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-models-preset
  namespace: llm
data:
  presets.ini: |
    version = 1

    ; Global defaults applied to all models
    [*]
    n-gpu-layers = -1

    ; --- Add a section per model file (name = filename without .gguf) ---

    [Qwen3.8-27B-UD-Q6_K_XL]
    c = 131072
    cont-batching = true
    parallel = 1
    flash-attn = on
    cache-type-k = q8_0
    cache-type-v = q8_0
    ; MTP head built into the model
    spec-type = draft-mtp
    ; n-max=2 avoids an unconfirmed upstream report of output drift at n-max=3 on MTP models
    spec-draft-n-max = 2
    spec-draft-p-min = 0.8
    load-on-startup = false
    stop-timeout = 60
    temp = 1.0
    top-p = 0.95
    top-k = 20
    min-p = 0.00
    presence-penalty = 0.0

    [Qwen3.6-27B-UD-Q6_K_XL]
    c = 131072
    cont-batching = true
    parallel = 1
    flash-attn = auto
    cache-type-k = q8_0
    cache-type-v = q8_0
    ; MTP head built into the model
    spec-type = draft-mtp
    spec-draft-n-max = 3
    load-on-startup = false
    stop-timeout = 60
    temp = 1.0
    top-p = 0.95
    top-k = 20
    min-p = 0.00
    presence-penalty = 1.5

    [Qwen3.6-27B-Q-8_0]
    c = 32000
    cont-batching = true
    parallel = 1
    flash-attn = auto
    cache-type-k = q8_0
    cache-type-v = q8_0
    ; MTP head built into the model
    spec-type = draft-mtp
    spec-draft-n-max = 3
    load-on-startup = false
    stop-timeout = 60
    temp = 1.0
    top-p = 0.95
    top-k = 20
    min-p = 0.00
    presence-penalty = 1.5
