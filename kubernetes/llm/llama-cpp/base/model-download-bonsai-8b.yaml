apiVersion: batch/v1
kind: Job
metadata:
  name: model-download-bonsai-8b
  namespace: llm
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: model-downloader
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65532
      containers:
        - name: downloader
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              MODEL_URL="https://huggingface.co/prism-ml/Bonsai-8B-gguf/resolve/main/Bonsai-8B.gguf"
              MODEL_FILE=$(basename "$MODEL_URL")
              MODEL_PATH="/models/$MODEL_FILE"
              TMP_PATH="/models/$MODEL_FILE.$$.tmp"
              if [ -f "$MODEL_PATH" ]; then
                echo "$MODEL_FILE already present, skipping download"
                exit 0
              fi
              echo "downloading $MODEL_FILE..."
              wget -O "$TMP_PATH" "$MODEL_URL" \
                || { rm -f "$TMP_PATH"; exit 1; }
              if [ -f "$MODEL_PATH" ]; then
                rm -f "$TMP_PATH"
                echo "$MODEL_FILE was downloaded by a concurrent job, skipping rename"
                exit 0
              fi
              mv "$TMP_PATH" "$MODEL_PATH"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
