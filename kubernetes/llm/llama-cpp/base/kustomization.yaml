apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - models-preset-configmap.yaml
  - model-download-job.yaml
  - resource-claim-template.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: llama-cpp-model-list
    namespace: llm
    files:
      - models.txt
  # Chat templates a preset can point at with chat-template-file = /templates/<file>
  - name: llama-cpp-chat-templates
    namespace: llm
    files:
      - chat-templates/qwen3.8-27b-unsloth.jinja
generatorOptions:
  disableNameSuffixHash: true
