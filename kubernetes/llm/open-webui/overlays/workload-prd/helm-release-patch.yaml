apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  values:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
    extraEnvVars:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: OFFLINE_MODE
        value: "true"
