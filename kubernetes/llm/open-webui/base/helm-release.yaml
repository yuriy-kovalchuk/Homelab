apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 5m
  releaseName: open-webui
  chart:
    spec:
      chart: open-webui
      version: "17.4.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  timeout: 20m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  values:
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      enabled: false
      redis:
        enabled: false
    openaiBaseApiUrls:
      - "http://llama-cpp.llm.svc.cluster.local:8080/v1"
      - "http://llama-cpp-rocm.llm.svc.cluster.local:8080/v1"
      - "http://strata.llm-strata.svc.cluster.local:8080/v1"
      - "http://llama-cpp-cuda.llm.svc.cluster.local:8080/v1"
    ingress:
      enabled: false

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
