apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inkling
  namespace: llm
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-inkling
  hostnames:
    - "inkling.yuriykovalchuk.dev"
  rules:
    # Strata only serves /v1/chat/completions; map the bare path for clients built
    # for llama-server (same as strata's route).
    - matches:
        - path:
            type: Exact
            value: /chat/completions
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - name: inkling
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inkling
          port: 8080
