apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: inkling-r9700
  namespace: llm
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  # R9700 (gfx1201) on bahamut, by sysfs PCI device ID (productName
                  # is empty on these cards). Exclusive: llama-cpp, strata and radiance
                  # claim the same card, so only one of them runs at a time.
                  expression: 'device.attributes["gpu.amd.com"].deviceID == "0x7551"'
