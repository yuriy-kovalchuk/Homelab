apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../llama-cpp/overlays/workload-prd
  - ../../llama-cpp-rocm/overlays/workload-prd  # ROCm (gfx1201); shares GPU + models PVC with the Vulkan pod, don't serve big models on both at once
