  - ../../strata/overlays/workload-prd  # Strata (HIP, gfx1201) — Flash-Next with expert caching + MTP; R9700 on bahamut
  - ../../strata-cuda/overlays/workload-prd  # UnbiasedStrata (strata-poly, CUDA 12) on the GTX 1070 (yojimbo); parked, shares llama-cpp-cuda's GPU and model volume
  - ../../sd-server/overlays/workload-prd  # stable-diffusion.cpp (Vulkan) — Qwen-Image-2.1 on the 780M iGPU, beside the chat models on the R9700
  - ../../open-webui/overlays/workload-prd
