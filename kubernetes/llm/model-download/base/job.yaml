# The one model downloader of the llm layer. Engine pods have no internet
# egress; this Job fills their volume from Hugging Face instead (allowed by
# network-policies/base/cluster-wide/allow-llm-model-download.yaml).
#
# Each engine instantiates it from <engine>/base/model-download/: namePrefix
# and namespace, its PVC (and node, for a strict-local volume), and its
# models.txt. Editing a list changes the list ConfigMap's hash and with it this
# Job's spec; force lets Flux recreate the immutable Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: OnFailure
      # The model volumes live on the GPU workers.
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: alpine:3.24.3
          command:
            - sh
            - /scripts/download.sh
            - /list/models.txt
          # Root: the engines (Strata, sd-server) own their volumes as uid 0.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: list
              mountPath: /list
              readOnly: true
      volumes:
        # claimName is set by each instance
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: scripts
          configMap:
            name: model-download-script
        - name: list
          configMap:
            name: model-download-list
