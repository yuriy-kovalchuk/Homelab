apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops
  namespace: alerting-rules
spec:
  groups:
    - name: gitops
      rules:
        - alert: FluxReconciliationFailure
          expr: gotk_reconcile_condition{type="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
            component: gitops
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} is not ready"
            description: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has failed to reconcile for more than 30 minutes."
