apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-health
  namespace: alerting-rules
spec:
  groups:
    - name: workload-health
      rules:
        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for more than 15 minutes."
        - alert: KubeDeploymentReplicasMismatch
          expr: (kube_deployment_spec_replicas - kube_deployment_status_replicas_available) > 0
          for: 15m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the desired number of available replicas for more than 15 minutes."
        - alert: ContainerOOMKilled
          expr: increase(container_oom_events_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Container in {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed in the last 15 minutes."
        - alert: KubeImagePullBackOff
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} can't pull its image"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in ImagePullBackOff for more than 15 minutes — check the image reference and registry credentials."
        - alert: KubePodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
          for: 15m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck {{ $labels.phase }}"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in phase {{ $labels.phase }} for more than 15 minutes — likely a scheduling or volume-attach failure."
        - alert: KubeJobFailed
          expr: kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has at least one failed pod and has not recovered for more than 5 minutes."
