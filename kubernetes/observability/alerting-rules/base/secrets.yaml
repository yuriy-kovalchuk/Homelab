apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets
  namespace: alerting-rules
spec:
  groups:
    - name: secrets
      rules:
        - alert: ExternalSecretSyncError
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
            component: secrets
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not synced"
            description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been in a not-Ready state for more than 15 minutes — Vault may be unreachable or the Kubernetes-auth bootstrap may be stale (see core/external-secrets/README.md)."
