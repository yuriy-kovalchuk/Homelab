apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: watchdog
  namespace: alerting-rules
spec:
  groups:
    - name: watchdog
      rules:
        - alert: Watchdog
          expr: vector(1)
          for: 0m
          labels:
            severity: none
            component: alerting
          annotations:
            summary: "Alerting pipeline heartbeat"
            description: "This alert is always firing. Alertmanager forwards it to the external dead-man's switch (healthchecks.io), which notifies when the pings stop, i.e. when the Mimir ruler -> Alertmanager pipeline itself is broken."
