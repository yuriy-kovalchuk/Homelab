apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificates
  namespace: alerting-rules
spec:
  groups:
    - name: certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
            component: certificates
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires soon"
            description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days."
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
            component: certificates
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"
            description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has been in a not-ready state for more than 30 minutes — renewal or issuance is likely failing."
