apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml

# Stable ConfigMap names: the observability Kustomization does not prune, so a
# hash suffix left the previous ConfigMap behind on every dashboard change and
# the sidecar flipped between the old and new copy of each file. Nothing mounts
# these ConfigMaps (the sidecar watches the label), so no rollout is needed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards-kubernetes
    namespace: grafana
    files:
      - dashboards/k8s-api.json
      - dashboards/k8s-coredns.json
      - dashboards/k8s-dashboard.json
      - dashboards/k8s-global.json
      - dashboards/k8s-namespaces.json
      - dashboards/k8s-network-mixin.json
      - dashboards/k8s-nodes.json
      - dashboards/k8s-pods.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Kubernetes

  - name: grafana-dashboards-infrastructure
    namespace: grafana
    files:
      - dashboards/node-exporter.json
      - dashboards/cert-manager.json
      - dashboards/flux-control-plane.json
      - dashboards/alertmanager.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Infrastructure

  - name: grafana-dashboards-security
    namespace: grafana
    files:
      - dashboards/trivy.json
      - dashboards/kyverno.json
      - dashboards/external-secrets.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Security

  - name: grafana-dashboards-networking
    namespace: grafana
    files:
    - dashboards/cloudflared.json
    - dashboards/hubble-http.json
    - dashboards/envoy-overview.json
    - dashboards/envoy-downstream.json
    - dashboards/envoy-clusters.json
    - dashboards/cilium-network.json
    - dashboards/cilium-dashboard.json
    - dashboards/cilium-operator-dashboard.json
    - dashboards/red-metrics.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Networking

  - name: grafana-dashboards-storage
    namespace: grafana
    files:
      - dashboards/longhorn.json
      - dashboards/k8s-persistent-volumes.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Storage

  - name: grafana-dashboards-energy
    namespace: grafana
    files:
      - dashboards/energy.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Energy

  - name: grafana-dashboards-gpu
    namespace: grafana
    files:
      - dashboards/nvidia-gpu.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/GPU
