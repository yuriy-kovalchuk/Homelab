# Tempo 3 in single-binary mode (target: all). Tempo 3 microservices need a
# Kafka-compatible broker for the write path; this mode passes spans in-process
# from the distributor to the live-store and metrics-generator instead. One pod:
# a drain of its node means about a minute without trace ingest (Alloy retries).
# Blocks live in S3 (same bucket as the 2.x tempo-distributed install).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tempo
spec:
  interval: 5m
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      version: "3.2.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
