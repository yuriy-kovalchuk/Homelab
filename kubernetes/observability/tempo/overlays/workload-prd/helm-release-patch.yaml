apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tempo
spec:
  values:
    replicas: 1

    tempo:
      reportingEnabled: false

      # S3 keys come from the env (tempo-s3-secret), expanded into tempo.yaml at
      # start, so they stay out of the chart's ConfigMap.
      extraArgs:
        config.expand-env: "true"
      extraEnvFrom:
        - secretRef:
            name: tempo-s3-secret

      # 2.x kept blocks 48h (tempo-distributed's compactor default); this chart
      # defaults to 24h.
      retention: 48h

      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo-traces
            endpoint: s3.yuriykovalchuk.dev:443
            region: eu-south-1
            insecure: false
            forcepathstyle: true
            access_key: ${S3_ACCESS_KEY}
            secret_key: ${S3_SECRET_KEY}
          wal:
            path: /var/tempo/wal
          # 3.1 writes vParquet5 by default; stay on the format 2.x wrote.
          block:
            version: vParquet4

      # Receivers: chart defaults (OTLP 4317/4318, plus Jaeger, which the chart's
      # Service template requires). Cilium only admits OTLP from Alloy.

      # Generates RED (rate/error/duration) metrics from traces and writes to Mimir.
      # Powers the Service Graph and Span Metrics panels in Grafana.
      metricsGenerator:
        enabled: true
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push
              headers:
                X-Scope-OrgID: "anonymous"

      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # WAL and live-store blocks; replicated so the pod can move on a drain.
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 10Gi

    serviceMonitor:
      enabled: true
