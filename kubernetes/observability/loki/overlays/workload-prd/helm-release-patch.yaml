apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  valuesFrom:
    - kind: Secret
      name: loki-s3-secret
      valuesKey: S3_ACCESS_KEY
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-s3-secret
      valuesKey: S3_SECRET_KEY
      targetPath: loki.storage.s3.secretAccessKey
  values:
    deploymentMode: Distributed

    loki:
      auth_enabled: false

      storage:
        type: s3
        s3:
          endpoint: https://s3.yuriykovalchuk.dev
          region: eu-south-1
          s3ForcePathStyle: true
          insecure: false
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      ingester:
        chunk_encoding: snappy

      querier:
        max_concurrent: 16

      pattern_ingester:
        enabled: true

      limits_config:
        volume_enabled: true
        retention_period: 168h

      compactor:
        retention_enabled: true
        delete_request_store: s3

    ingester:
      replicas: 3
      zoneAwareReplication:
        enabled: false
      # WAL survives pod restarts; small because chunks flush to S3 within ~2h
      persistence:
        enabled: true
        claims:
          - name: data
            size: 5Gi
            storageClass: longhorn-1r
            accessModes:
              - ReadWriteOnce

    querier:
      replicas: 2
      maxUnavailable: 1

    queryFrontend:
      replicas: 2
      maxUnavailable: 1

    queryScheduler:
      replicas: 2

    distributor:
      replicas: 2
      maxUnavailable: 1

    compactor:
      replicas: 1

    indexGateway:
      replicas: 2
      maxUnavailable: 1

    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    singleBinary:
      replicas: 0

    lokiCanary:
      tolerations:
        - key: workload
          operator: Equal
          value: gpu
          effect: NoSchedule

    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        namespace: grafana
        annotations:
          k8s-sidecar-target-directory: /tmp/dashboards/Loki Dashboards
