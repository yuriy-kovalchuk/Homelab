apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy
  namespace: k8s-monitoring
spec:
  parentRefs:
    - name: internal
      namespace: main-gateway
      sectionName: https-alloy
  hostnames:
    - "alloy.yuriy-lab.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: k8s-monitoring-alloy-metrics-cluster
          port: 12345
