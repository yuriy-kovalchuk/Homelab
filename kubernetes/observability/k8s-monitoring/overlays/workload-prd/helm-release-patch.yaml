apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: k8s-monitoring
spec:
  values:
    cluster:
      name: workload-prd

    global:
      scrapeInterval: 15s

    destinations:
      loki:
        type: loki
        url: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push
      mimir:
        type: prometheus
        url: http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push
        writeAheadLog:
          maxKeepaliveTime: "24h"
          minKeepaliveTime: "5m"
          truncateFrequency: "2h"
        # Cardinality control. These _bucket families are the bulk of their
        # jobs' series and are queried by no Grafana dashboard and no
        # PrometheusRule in this cluster (audited 2026-08-25 against every
        # grafana_dashboard ConfigMap and every PrometheusRule).
        # Only the _bucket series are dropped: _sum and _count survive, so
        # averages and rates still work. What is lost is histogram_quantile()
        # over these families — add a name back here if a panel ever needs it.
        # Applied at remote_write, so one rule covers every scrape job.
        metricProcessingRules: |
          write_relabel_config {
            source_labels = ["__name__"]
            regex = "kyverno_(validating_policy_execution|admission_review)_duration_seconds_bucket"
            action = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__"]
            regex = "longhorn_rest_client_(rate_limiter_latency|request_latency)_seconds_bucket|longhorn_workqueue_(queue|work)_duration_seconds_bucket"
            action = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__"]
            regex = "workqueue_(queue|work)_duration_seconds_bucket|controller_runtime_reconcile_time_seconds_bucket"
            action = "drop"
          }
          write_relabel_config {
            source_labels = ["__name__"]
            regex = "envoy_cluster_upstream_cx_(connect|length)_ms_bucket"
            action = "drop"
          }
      tempo:
        type: otlp
        url: http://tempo-distributor.tempo.svc.cluster.local:4317
        protocol: grpc
        tls:
          insecure: true

    selfReporting:
      enabled: false

    collectors:
      alloy-logs:
        controller:
          tolerations:
            - key: workload
              operator: Equal
              value: gpu
              effect: NoSchedule
        alloy:
          mounts:
            varlog: true
            dockercontainers: false
          clustering:
            enabled: true
          extraArgs:
            - --disable-reporting
      alloy-singleton:
        alloy:
          extraArgs:
            - --disable-reporting
      alloy-metrics:
        controller:
          tolerations:
            - key: workload
              operator: Equal
              value: gpu
              effect: NoSchedule
        alloy:
          clustering:
            enabled: true
          extraArgs:
            - --disable-reporting
        # Syncs PrometheusRule CRDs cluster-wide into Mimir's ruler — the
        # GitOps path for alerting rules (see kubernetes/observability/alerting-rules).
        # tenant_id matches the X-Scope-OrgID Grafana's Mimir datasource already sends.
        extraConfig: |
          mimir.rules.kubernetes "this" {
            address   = "http://mimir-ruler.mimir.svc.cluster.local:8080"
            tenant_id = "anonymous"
          }
      alloy-receiver:
        controller:
          tolerations:
            - key: workload
              operator: Equal
              value: gpu
              effect: NoSchedule
        alloy:
          extraArgs:
            - --disable-reporting

    telemetryServices:
      kube-state-metrics:
        deploy: true
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
      node-exporter:
        deploy: true
        tolerations:
          - key: workload
            operator: Equal
            value: gpu
            effect: NoSchedule
        # extraArgs replaces the chart default array — keep the fs-types-exclude entry
        extraArgs:
          - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs)$
          # Temperature, fan and voltage readings now come from talos-monitoring
          # (talos_sensor_*), read from the Talos API rather than /sys/class/hwmon.
          # hwmon is enabled by default in node_exporter, so turning it off needs
          # the explicit negative flag — dropping `--collector.hwmon` alone is a
          # no-op. thermal_zone is also on by default; the flag below is likewise
          # redundant but left in place as documentation of intent.
          - --no-collector.hwmon
          - --collector.thermal_zone
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false

    alloy-operator:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir
      kube-state-metrics:
        metricsTuning:
          includeMetrics:
            - kube_namespace_created
      kubelet:
        metricsTuning:
          useDefaultAllowList: true
          includeMetrics:
            - kubelet_node_name
            - kubernetes_build_info
      cadvisor:
        metricsTuning:
          useDefaultAllowList: true
          dropEmptyImageLabels: true
          keepPhysicalNetworkDevices: []
          keepPhysicalFilesystemDevices: []
          includeMetrics:
            - machine_cpu_cores
            - kubernetes_build_info
            # --- CPU Metrics ---
            - container_cpu_usage_seconds_total
            - container_cpu_user_seconds_total
            - container_cpu_system_seconds_total
            - container_cpu_cfs_periods_total
            - container_cpu_cfs_throttled_periods_total
            - container_cpu_cfs_throttled_seconds_total
            - container_cpu_load_average_10s
            - container_spec_cpu_quota
            - container_spec_cpu_period
            # --- Memory Metrics ---
            - container_memory_working_set_bytes
            - container_memory_usage_bytes
            - container_memory_rss
            - container_memory_cache
            - container_memory_swap
            - container_memory_max_usage_bytes
            - container_memory_failcnt
            - container_memory_failures_total
            - container_oom_events_total
            - container_spec_memory_limit_bytes
            - container_spec_memory_swap_limit_bytes
            # --- Network Metrics ---
            - container_network_receive_bytes_total
            - container_network_receive_packets_total
            - container_network_receive_packets_dropped_total
            - container_network_receive_errors_total
            - container_network_transmit_bytes_total
            - container_network_transmit_packets_total
            - container_network_transmit_packets_dropped_total
            - container_network_transmit_errors_total
            # --- Filesystem & Block I/O Metrics ---
            - container_fs_usage_bytes
            - container_fs_limit_bytes
            - container_fs_reads_bytes_total
            - container_fs_reads_total
            - container_fs_writes_bytes_total
            - container_fs_writes_total
            - container_fs_io_current
            - container_fs_io_time_seconds_total
            - container_fs_inodes_total
            - container_fs_inodes_free
            - container_blkio_device_usage_total

            # --- Process & Runtime Lifecycle Metrics ---
            - container_processes
            - container_threads
            - container_threads_max
            - container_file_descriptors
            - container_start_time_seconds
            - container_last_seen
      controlPlane:
        enabled: true
      # controlPlane above turns on the API Server scrape, which ships with no
      # allow list — it keeps every series the endpoint exposes, and at ~297k
      # series it is 64% of everything in Mimir. Each name below is a _bucket
      # family used by no dashboard and no PrometheusRule (audited 2026-08-25).
      # apiserver_request_duration_seconds_bucket is deliberately NOT here:
      # k8s-api.json and the cluster-core alerting rules both query it.
      apiServer:
        metricsTuning:
          excludeMetrics:
            - etcd_request_duration_seconds_bucket
            - apiserver_request_sli_duration_seconds_bucket
            - apiserver_request_body_size_bytes_bucket
            - apiserver_watch_list_duration_seconds_bucket
            - apiserver_watch_cache_read_wait_seconds_bucket
            - apiserver_response_sizes_bucket
            - apiserver_watch_events_sizes_bucket
            - apiserver_admission_controller_admission_duration_seconds_bucket
            - apiserver_admission_webhook_admission_duration_seconds_bucket
      kubeControllerManager:
        enabled: true
      kubeDNS:
        enabled: true
      kubeScheduler:
        enabled: true

    hostMetrics:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir
      linuxHosts:
        enabled: true
        metricsTuning:
          useIntegrationAllowList: true
          includeMetrics:
            - node_thermal_zone_temp

    clusterEvents:
      enabled: true
      collector: alloy-singleton
      namespaces: []
      destinations:
        - loki

    nodeLogs:
      enabled: false

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      namespaces: []
      destinations:
        - loki
      labels:
        app_kubernetes_io_name: app.kubernetes.io/name
        instance: app.kubernetes.io/instance
        level: level
        service_name: service.name
        service_namespace: service.namespace
        deployment_environment: deployment.environment
        deployment_environment_name: deployment.environment.name
      structuredMetadata:
        pod: pod
        k8s.pod.name: k8s.pod.name
        service.instance.id: service.instance.id

    applicationObservability:
      enabled: true
      collector: alloy-receiver
      destinations:
        - tempo
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true

    autoInstrumentation:
      # Disabled: chart 4.4.0 cannot render a working Beyla config.
      # charts/feature-auto-instrumentation/templates/_beyla-config.tpl forces
      # BOTH internal_metrics.prometheus.port and prometheus_export.port to
      # beyla.service.targetPort, and `merge $overrides $config` gives those
      # overrides priority — so the ports below are discarded and Beyla is told
      # to bind :9090 twice. The second listener fails with
      # "bind: address already in use" and, with hostNetwork: true, the pod
      # never recovers (2137 restarts, 1/4 ready). Setting service.targetPort
      # does not help: it moves both ports to the same new number.
      # The DaemonSet never going ready also stalls every `helm upgrade`.
      # Re-enable once the chart lets the two ports differ. The config below is
      # kept intact so that is a one-line change.
      enabled: false
      collector: alloy-metrics
      destinations:
        - mimir
      beyla:
        tolerations:
          - key: workload
            operator: Equal
            value: gpu
            effect: NoSchedule
        preset: application
        config:
          data:
            internal_metrics:
              prometheus:
                port: 9091
            prometheus_export:
              port: 19090
              features:
                - application
                - application_service_graph
                - application_span
                - application_host
            otel_traces_export:
              endpoint: http://k8s-monitoring-alloy-receiver.k8s-monitoring.svc.cluster.local:4317
            discovery:
              instrument:
                - k8s_pod_labels:
                    beyla.grafana.com/instrument: "true"
              exclude_instrument:
                - exe_path: "{*alloy*,*otelcol*,*beyla*}"

    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir

    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
      destinations:
        - mimir

    integrations:
      collector: alloy-metrics
      destinations:
        - mimir
