apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-monitoring
  namespace: talos-monitoring
spec:
  interval: 5m
  suspend: false
  chartRef:
    kind: OCIRepository
    name: talos-monitoring
    namespace: talos-monitoring
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Omni refuses os:admin for in-cluster Talos API access (the talos.dev
  # ServiceAccount the chart creates), and the file-based collectors (sensors →
  # CPU/GPU/NVMe temperatures, GPU counters, PCI link speed) need the admin-only
  # Read RPC. So the pod mounts the direct (non-Omni) os:admin talosconfig from
  # Vault instead (secrets/base/observability-talos-monitoring.yaml) and the
  # chart's talos.dev ServiceAccount is dropped. The chart (0.2.0) has no value
  # for an existing Secret, hence the post-renderer.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: talos-monitoring
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: talos-monitoring
              spec:
                template:
                  spec:
                    volumes:
                      - name: talos-config
                        secret:
                          secretName: talos-monitoring-talosconfig
          - target:
              group: talos.dev
              kind: ServiceAccount
              name: talos-monitoring
            patch: |
              $patch: delete
              apiVersion: talos.dev/v1alpha1
              kind: ServiceAccount
              metadata:
                name: talos-monitoring
  values:
    serviceMonitor:
      enabled: true
    grafana:
      enabled: true
      sidecarTargetDirectory: /tmp/dashboards/Talos
