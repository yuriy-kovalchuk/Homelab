apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-monitoring
  namespace: talos-monitoring
spec:
  interval: 5m
  suspend: false
  chartRef:
    kind: OCIRepository
    name: talos-monitoring
    namespace: talos-monitoring
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    talos:
      roles:
        - os:admin
    serviceMonitor:
      enabled: true
    grafana:
      enabled: true
      sidecarTargetDirectory: /tmp/dashboards/Talos
