apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-monitoring
  namespace: talos-monitoring
spec:
  interval: 5m
  suspend: false
  chartRef:
    kind: OCIRepository
    name: talos-monitoring
    namespace: talos-monitoring
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    talos:
      # Omni (which manages the Talos configs) refuses os:admin for in-cluster
      # Talos API access, so the nodes only allow os:reader. Every COSI /
      # machine-API collector works with it; the file-based ones (sensors,
      # hwmon, DMI), which need the admin-only Read RPC, switch themselves off.
      roles:
        - os:reader
    serviceMonitor:
      enabled: true
    grafana:
      enabled: true
      sidecarTargetDirectory: /tmp/dashboards/Talos
