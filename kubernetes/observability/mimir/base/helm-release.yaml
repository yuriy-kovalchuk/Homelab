apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: mimir
spec:
  interval: 5m
  releaseName: mimir
  chart:
    spec:
      chart: mimir-distributed
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  timeout: 30m
  install:
    createNamespace: false
  upgrade:
    timeout: 30m
    remediation:
      retries: 3
