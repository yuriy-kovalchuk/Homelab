apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
  namespace: alertmanager
spec:
  valuesFrom:
    - kind: Secret
      name: alertmanager-slack-webhook
      valuesKey: SLACK_API_URL
      targetPath: config.global.slack_api_url
  values:
    replicaCount: 1

    persistence:
      enabled: true
      storageClass: "longhorn-1r"
      size: 1Gi

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true

    serviceMonitor:
      enabled: true

    # slack_api_url is injected via valuesFrom (config.global.slack_api_url)
    # from the alertmanager-slack-webhook Secret — see external-secret.yaml.
    config:
      receivers:
        - name: slack-alerts
          slack_configs:
            - channel: "#alerts"
              send_resolved: true
              title: >-
                {{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}
                [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})
              text: >-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Summary:* {{ .Annotations.summary }}
                {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}
                {{ end }}{{ if .Labels.namespace }}*Namespace:* {{ .Labels.namespace }}
                {{ end }}{{ if .Labels.node }}*Node:* {{ .Labels.node }}
                {{ end }}
                {{ end }}
      route:
        receiver: slack-alerts
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 3h
