apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
  namespace: alertmanager
spec:
  values:
    replicaCount: 1

    persistence:
      enabled: true
      storageClass: "longhorn-1r"
      size: 1Gi

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true

    serviceMonitor:
      enabled: true

    # The webhook URL is read from a file mounted from the ExternalSecret-backed
    # Secret (secrets/base/observability-alertmanager.yaml), so it never ends
    # up in the rendered ConfigMap.
    extraSecretMounts:
      - name: slack-webhook
        mountPath: /etc/alertmanager-secrets/slack
        secretName: alertmanager-slack-webhook
        readOnly: true

    # Rendered next to alertmanager.yml in /etc/alertmanager.
    templates:
      updates.tmpl: |-
        {{ define "updates.line" }}• <https://github.com/yuriy-kovalchuk/{{ .Labels.source }}/blob/main/{{ .Labels.path }}|{{ .Labels.dependency }}>  `{{ .Labels.current_version }}` → `{{ .Labels.latest_version }}`  _{{ .Labels.chart }}_
        {{ end }}

        {{ define "updates.color" }}
        {{- $c := "good" }}
        {{- range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyMajor" "UpdateCheckerDigestDrift" }}{{ $c = "danger" }}{{ end }}{{ end }}
        {{- $c }}
        {{- end }}

        {{ define "updates.text" }}
        {{- $has := false }}{{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyMajor" }}{{ $has = true }}{{ end }}{{ end }}
        {{- if $has }}*:red_circle: Major*
        {{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyMajor" }}{{ template "updates.line" . }}{{ end }}{{ end }}{{ "\n" }}
        {{- end }}
        {{- $has = false }}{{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyMinor" }}{{ $has = true }}{{ end }}{{ end }}
        {{- if $has }}*:large_orange_circle: Minor*
        {{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyMinor" }}{{ template "updates.line" . }}{{ end }}{{ end }}{{ "\n" }}
        {{- end }}
        {{- $has = false }}{{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyPatch" }}{{ $has = true }}{{ end }}{{ end }}
        {{- if $has }}*:white_circle: Patch*
        {{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyPatch" }}{{ template "updates.line" . }}{{ end }}{{ end }}{{ "\n" }}
        {{- end }}
        {{- $has = false }}{{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyUnknown" }}{{ $has = true }}{{ end }}{{ end }}
        {{- if $has }}*:grey_question: Not semver (pin or check by hand)*
        {{ range .Alerts.Firing }}{{ if eq .Labels.alertname "OutdatedDependencyUnknown" }}{{ template "updates.line" . }}{{ end }}{{ end }}{{ "\n" }}
        {{- end }}
        {{- $has = false }}{{ range .Alerts.Firing }}{{ if eq .Labels.alertname "UpdateCheckerDigestDrift" }}{{ $has = true }}{{ end }}{{ end }}
        {{- if $has }}*:warning: Image digest moved (same tag, new image: check who published it)*
        {{ range .Alerts.Firing }}{{ if eq .Labels.alertname "UpdateCheckerDigestDrift" }}• <https://github.com/yuriy-kovalchuk/{{ .Labels.source }}/blob/main/{{ .Labels.path }}|{{ .Labels.dependency }}>  _{{ .Labels.chart }}_
        {{ end }}{{ end }}
        {{- end }}
        {{- end }}

    config:
      global:
        slack_api_url_file: /etc/alertmanager-secrets/slack/SLACK_API_URL
      templates:
        - /etc/alertmanager/*.tmpl
      receivers:
        - name: slack-alerts
          slack_configs:
            - channel: "#alerts"
              send_resolved: true
              title: >-
                {{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}
                [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Summary:* {{ .Annotations.summary }}
                {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}
                {{ end }}{{ if .Labels.namespace }}*Namespace:* {{ .Labels.namespace }}
                {{ end }}{{ if .Labels.node }}*Node:* {{ .Labels.node }}
                {{ end }}
                {{ end }}
        # One digest per scanned repo. Incoming webhooks post to the channel
        # they were created for, so a separate #updates channel needs its own
        # webhook (api_url_file) rather than a different `channel`.
        - name: slack-updates
          slack_configs:
            - channel: "#alerts"
              send_resolved: false
              color: '{{ template "updates.color" . }}'
              title: ':package: {{ .CommonLabels.source }}: {{ .Alerts.Firing | len }} updates available'
              title_link: 'https://github.com/yuriy-kovalchuk/{{ .CommonLabels.source }}'
              text: '{{ template "updates.text" . }}'
              footer: yk-update-checker
      route:
        receiver: slack-alerts
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 3h
        routes:
          - matchers:
              - alertname =~ "OutdatedDependency.*|UpdateCheckerDigestDrift"
            receiver: slack-updates
            group_by: ['source']
            # Let a whole scan land before posting; remind once a day.
            group_wait: 5m
            group_interval: 1h
            repeat_interval: 24h
