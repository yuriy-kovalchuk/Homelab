---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/observability/overlays/workload-prd
  prune: true
  wait: true
  timeout: 15m
