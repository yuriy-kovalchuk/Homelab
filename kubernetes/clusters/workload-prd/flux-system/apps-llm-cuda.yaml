---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-llm-cuda
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: infrastructure
    - name: apps-llm
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/llama-cpp-cuda/overlays/workload-prd
  prune: true
  wait: false
