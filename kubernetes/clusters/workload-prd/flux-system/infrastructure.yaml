---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/infrastructure/overlays/workload-prd
  prune: true
  wait: true
  timeout: 5m
