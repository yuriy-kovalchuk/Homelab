---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerting-rules
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: observability
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/observability/alerting-rules/overlays/workload-prd
  prune: true
  wait: false
