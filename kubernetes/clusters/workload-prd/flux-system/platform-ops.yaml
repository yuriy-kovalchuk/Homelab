---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ops
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: platform-infra
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/platform/ops/overlays/workload-prd
  prune: true
  wait: false
  timeout: 15m
