---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: policies
    - name: platform-infra
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/overlays/workload-prd
  prune: false
  wait: false
  timeout: 5m
  # Same escape hatch as the llm Kustomization, but scoped to one Deployment:
  # forgejo-runner-talos is parked with `kubectl scale` while bahamut is off.
  # Git's replicas: 1 only seeds the object on creation; afterwards Flux leaves
  # the count alone (still correcting image, resources, mounts, ...). Every
  # other app in this layer keeps its replica count Git-owned.
  ignore:
    - paths:
        - /spec/replicas
      target:
        kind: Deployment
        name: ^forgejo-runner-talos$
        namespace: forgejo-runner
