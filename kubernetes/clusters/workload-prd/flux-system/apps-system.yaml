---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-system
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/system/workload-prd
  prune: true
  wait: true
