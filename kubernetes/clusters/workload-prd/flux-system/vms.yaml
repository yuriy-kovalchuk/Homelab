---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vm-ubuntu-test
  namespace: flux-system
spec:
  # Managed from the terminal for now (kubectl / virtctl): Flux does not apply
  # kubernetes/vms/ubuntu-test. Set to false to hand it back to Flux.
  suspend: true
  interval: 5m
  dependsOn:
    - name: platform-infra
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/vms/ubuntu-test
  prune: false
  wait: false
  timeout: 5m
