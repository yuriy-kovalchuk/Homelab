---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-policies
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/llm/policies/workload-prd
  prune: true
  wait: true
