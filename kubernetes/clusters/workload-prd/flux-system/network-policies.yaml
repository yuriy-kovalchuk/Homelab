---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: namespaces
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/network-policies/overlays/workload-prd
  prune: true
  wait: true
  timeout: 5m
