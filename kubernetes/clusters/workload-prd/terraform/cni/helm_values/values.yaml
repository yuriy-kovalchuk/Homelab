kubeProxyReplacement: true

k8sServiceHost: localhost
k8sServicePort: 7445

ipam:
  mode: kubernetes

# Every node is on the same L2 (VLAN 4), so pod traffic goes straight to the
# other node's address instead of a VXLAN tunnel (no 50-byte header, full MTU).
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# WireGuard between nodes (built into the Talos kernel). Pod-to-pod traffic is
# encrypted on every node; nodeEncryption also covers host-to-host traffic,
# except control planes, which opt out by default (etcd, kubelet and the API
# are TLS already). Strict mode (dropping unencrypted traffic) is a later step,
# once every node reports "Encryption: Wireguard".
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# Pinned: auto-detection takes the lowest MTU of all devices, and Talos'
# siderolink (1280) dragged cilium_host down to 1280. Full-size packets
# redirected to the gateway's Envoy were then dropped, stalling large uploads.
MTU: 1500

# The agents read cilium-config only at startup; roll them when it changes.
rollOutCiliumPods: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

gatewayAPI:
  enabled: true

bgpControlPlane:
  enabled: true

l2announcements:
  enabled: false

externalIPs:
  enabled: true

# Metrics are scraped by Alloy through the prometheus.io annotations the chart
# puts on the pods. No ServiceMonitors: their CRD does not exist yet when this
# Terraform unit installs Cilium on a fresh cluster.
envoy:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

hubble:
  relay:
    enabled: true
    prometheus:
      enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - "dns:query;ignoreAAAA;labelsContext=source_namespace,source_app,destination_namespace,destination_app"
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_namespace,source_app,destination_namespace,destination_app,traffic_direction"
      - kafka
      - "policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity"
      - flows-to-world:any-drop=true
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Networking

grafana:
  dashboards:
    enabled: true
    annotations:
      k8s-sidecar-target-directory: /tmp/dashboards/Networking

bpf:
  masquerade: true
  tproxy: true

socketLB:
  hostNamespaceOnly: true

operator:
  replicas: 2
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
