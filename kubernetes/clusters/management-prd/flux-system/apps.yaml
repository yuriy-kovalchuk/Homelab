apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/apps/overlays/management-prd
  prune: true
  wait: true
  timeout: 10m
