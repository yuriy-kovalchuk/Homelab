---
# BGP peering with the Cilium BGP Control Plane on the management cluster.
# OPNsense ASN: 65551, router-id: 10.0.2.1 (K8sMgmt VLAN gateway)
# Peer: mgmt-1 at 10.0.2.2, ASN 65001
- name: Configure FRR BGP peering
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    - name: Install os-frr plugin
      oxlorg.opnsense.package:
        name: os-frr
        action: install
      register: frr_pkg

    - name: Reboot OPNsense to load FRR API endpoints
      oxlorg.opnsense.system:
        action: reboot
        wait: true
        wait_timeout: 120
      when: frr_pkg.changed

    - name: Enable FRR
      oxlorg.opnsense.frr_general:
        enabled: true
        log: true
        log_level: notifications
        reload: false

    - name: Configure BGP general (ASN + router-id)
      oxlorg.opnsense.frr_bgp_general:
        enabled: true
        as_number: 65551
        id: "10.0.2.1"
        graceful: true
        log_neighbor_changes: true
        network_import_check: false
        reload: false

    - name: Add mgmt-1 BGP neighbor
      oxlorg.opnsense.frr_bgp_neighbor:
        ip: "10.0.2.2"
        as_number: 65001
        description: mgmt-1
        next_hop_self: true
        multi_hop: false
        keepalive: 30
        hold_down: 90
        connect_timer: 120
        reload: true
