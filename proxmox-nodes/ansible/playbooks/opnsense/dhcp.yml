---
- name: Configure OPNsense DHCP servers
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"
  vars:
    dhcp_subnets:
      - subnet: "10.0.3.0/24"
        description: "storage"
        gateway: ["10.0.3.1"]
        pools: ["10.0.3.100 - 10.0.3.200"]
      - subnet: "10.0.4.0/24"
        description: "k8s-workload"
        gateway: ["10.0.4.1"]
        pools: ["10.0.4.100 - 10.0.4.200"]
      - subnet: "10.0.5.0/24"
        description: "phys-workload"
        gateway: ["10.0.5.1"]
        pools: ["10.0.5.100 - 10.0.5.200"]
  tasks:
    # dns/ntp must be explicit: the module defaults them to [] and wipes the
    # live values otherwise (autocollect only fills them on GUI saves).
    - name: Configure DHCP subnet
      oxlorg.opnsense.dhcp_subnet:
        subnet: "{{ item.subnet }}"
        description: "{{ item.description }}"
        gateway: "{{ item.gateway }}"
        pools: "{{ item.pools }}"
        dns_servers: "{{ item.gateway }}"
        ntp_servers: "{{ item.gateway }}"
        state: present
      loop: "{{ dhcp_subnets }}"

    - name: Reload DHCP config
      oxlorg.opnsense.reload:
        target: dhcp
