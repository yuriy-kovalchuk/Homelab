---
- name: Configure DHCP reservations
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"
  vars:
    # 10.0.4.0/24 plan: .2–.9 control-plane nodes, .10 k8s API VIP,
    # .11+ workers, .50–.99 Cilium LB pool, .100–.200 DHCP pool.
    reservations:
      - subnet: "10.0.3.0/24"
        ip: "10.0.3.3"
        mac: "bc:24:11:19:5c:66"
        hostname: "truenas"
        description: "TrueNAS SCALE VM"
      - subnet: "10.0.4.0/24"
        ip: "10.0.4.6"
        mac: "00:e0:4c:68:10:09"
        hostname: "ifrit"
        description: "ifrit workload control-plane"
      - subnet: "10.0.4.0/24"
        ip: "10.0.4.5"
        mac: "fc:3f:db:0f:8e:18"
        hostname: "valefor"
        description: "valefor workload control-plane"
      - subnet: "10.0.4.0/24"
        ip: "10.0.4.7"
        mac: "10:62:e5:17:93:cf"
        hostname: "shiva"
        description: "shiva workload control-plane"
  tasks:
    - name: Reserve node IPs
      oxlorg.opnsense.dhcp_reservation:
        subnet: "{{ item.subnet }}"
        ip: "{{ item.ip }}"
        mac: "{{ item.mac }}"
        hostname: "{{ item.hostname }}"
        description: "{{ item.description }}"
        state: present
        reload: false
      loop: "{{ reservations }}"

    - name: Reload DHCP config
      oxlorg.opnsense.reload:
        target: dhcp
