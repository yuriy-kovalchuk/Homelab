---
# Interface name mapping (opt-labels are assigned per-interface and stay
# stable even after other VLANs are unassigned — opt2/opt3/opt4 kept their
# labels when opt1/opt5/opt6 (VLAN 2/6/7) were removed):
#   opt2 = VLAN 3 — storage        (10.0.3.0/24)
#   opt3 = VLAN 4 — k8s-workload   (10.0.4.0/24)
#   opt4 = VLAN 5 — phys-workload  (10.0.5.0/24)
#   opt1 = VLAN 6 — remote-access  (10.0.6.0/24, Tailscale subnet router VM;
#          GUI description "Tailscale")
#
# All aliases and rules are created with reload: false.
# A single reload at the end applies everything atomically — this avoids
# pfctl re-enabling mid-run and blocking the remaining API calls.
#
- name: Configure OPNsense firewall aliases and rules
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    # -------------------------------------------------------------------------
    # Aliases
    # -------------------------------------------------------------------------

    - name: Create network and port aliases
      oxlorg.opnsense.alias:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description }}"
        reload: false
        state: present
      loop:
        - name: HOMELAB_ALL
          type: network
          content: ["10.0.0.0/16"]
          description: "All homelab subnets"
        - name: VLAN3_NET
          type: network
          content: ["10.0.3.0/24"]
          description: "storage"
        - name: VLAN4_NET
          type: network
          content: ["10.0.4.0/24"]
          description: "k8s-workload"
        - name: VLAN5_NET
          type: network
          content: ["10.0.5.0/24"]
          description: "phys-workload"
        - name: VLAN6_NET
          type: network
          content: ["10.0.6.0/24"]
          description: "remote-access"
        - name: TAILSCALE_UDP
          type: port
          content: ["41641", "3478"]
          description: "Tailscale direct WireGuard + STUN"
        - name: PRIVATE_NON_LAB
          type: network
          content: ["192.168.0.0/16", "172.16.0.0/12"]
          description: "Private ranges outside the homelab (home LAN behind the ISP router)"
        - name: WEB_PORTS
          type: port
          content: ["80", "443"]
          description: "HTTP + HTTPS"
        - name: NFS_PORT
          type: port
          content: ["2049"]
          description: "NFS"

    # -------------------------------------------------------------------------
    # Rules — WAN management access
    # Allows the home network to reach the OPNsense API after pfctl comes up.
    # Without this rule the firewall would lock you out on first reload.
    # -------------------------------------------------------------------------

    - name: "wan | management access from home network"
      oxlorg.opnsense.rule:
        sequence: 1
        interface: ["wan"]
        direction: in
        action: pass
        protocol: TCP
        source_net: "192.168.0.0/24"
        destination_net: "192.168.0.110/32"
        destination_port: "443"
        description: "wan-01 management access from home network"
        reload: false
        match_fields: ["description"]

    # -------------------------------------------------------------------------
    # Rules — opt2 (VLAN 3 — storage)
    # OUT: gateway DNS, internet (port 80/443 only), k8s-workload K8s API (Vault→TokenReview)
    # -------------------------------------------------------------------------

    - name: "opt2 | storage → gateway (DNS)"
      oxlorg.opnsense.rule:
        sequence: 5
        interface: ["opt2"]
        direction: in
        action: pass
        protocol: "TCP/UDP"
        source_net: VLAN3_NET
        destination_net: "10.0.3.1/32"
        destination_port: "53"
        description: "opt2-05 storage to gateway dns"
        reload: false
        match_fields: ["description"]

    - name: "opt2 | storage → internet (DNS)"
      oxlorg.opnsense.rule:
        sequence: 8
        interface: ["opt2"]
        direction: in
        action: pass
        protocol: "TCP/UDP"
        source_net: VLAN3_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        destination_port: "53"
        description: "opt2-08 storage to internet dns"
        reload: false
        match_fields: ["description"]

    - name: "opt2 | storage → internet (web only)"
      oxlorg.opnsense.rule:
        sequence: 10
        interface: ["opt2"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN3_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        destination_port: WEB_PORTS
        description: "opt2-10 storage to internet web only"
        reload: false
        match_fields: ["description"]

    - name: "opt2 | storage → k8s-workload (K8s API)"
      oxlorg.opnsense.rule:
        sequence: 15
        interface: ["opt2"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN3_NET
        destination_net: VLAN4_NET
        destination_port: "6443"
        description: "opt2-15 storage to k8s-workload k8s api"
        reload: false
        match_fields: ["description"]

    # -------------------------------------------------------------------------
    # Rules — opt3 (VLAN 4 — k8s-workload)
    # OUT: gateway DNS + NTP + HTTPS API + BGP, storage (full), internet
    # -------------------------------------------------------------------------

    - name: "opt3 | k8s-workload → gateway (DNS)"
      oxlorg.opnsense.rule:
        sequence: 5
        interface: ["opt3"]
        direction: in
        action: pass
        protocol: "TCP/UDP"
        source_net: VLAN4_NET
        destination_net: "10.0.4.1/32"
        destination_port: "53"
        description: "opt3-05 k8s-workload to gateway dns"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → gateway (NTP)"
      oxlorg.opnsense.rule:
        sequence: 6
        interface: ["opt3"]
        direction: in
        action: pass
        protocol: UDP
        source_net: VLAN4_NET
        destination_net: "10.0.4.1/32"
        destination_port: "123"
        description: "opt3-06 k8s-workload to gateway ntp"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → gateway (HTTPS API)"
      oxlorg.opnsense.rule:
        sequence: 7
        interface: ["opt3"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN4_NET
        destination_net: "10.0.4.1/32"
        destination_port: "443"
        description: "opt3-07 k8s-workload to gateway https api"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → gateway (BGP)"
      oxlorg.opnsense.rule:
        sequence: 8
        interface: ["opt3"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN4_NET
        destination_net: "10.0.4.1/32"
        destination_port: "179"
        description: "opt3-08 k8s-workload to gateway bgp"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → k8s API VIP (HAProxy)"
      oxlorg.opnsense.rule:
        sequence: 9
        interface: ["opt3"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN4_NET
        destination_net: "10.0.4.10/32"
        destination_port: "6443"
        description: "opt3-09 k8s-workload to k8s api vip"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → storage (full)"
      oxlorg.opnsense.rule:
        sequence: 10
        interface: ["opt3"]
        direction: in
        action: pass
        source_net: VLAN4_NET
        destination_net: VLAN3_NET
        description: "opt3-10 k8s-workload to storage"
        reload: false
        match_fields: ["description"]

    - name: "opt3 | k8s-workload → internet"
      oxlorg.opnsense.rule:
        sequence: 30
        interface: ["opt3"]
        direction: in
        action: pass
        source_net: VLAN4_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        description: "opt3-30 k8s-workload to internet"
        reload: false
        match_fields: ["description"]

    # -------------------------------------------------------------------------
    # Rules — opt4 (VLAN 5 — phys-workload)
    # OUT: all homelab, internet
    # -------------------------------------------------------------------------

    - name: "opt4 | phys-workload → homelab (all VLANs)"
      oxlorg.opnsense.rule:
        sequence: 10
        interface: ["opt4"]
        direction: in
        action: pass
        source_net: VLAN5_NET
        destination_net: HOMELAB_ALL
        description: "opt4-10 phys-workload to homelab"
        reload: false
        match_fields: ["description"]

    - name: "opt4 | phys-workload → internet"
      oxlorg.opnsense.rule:
        sequence: 20
        interface: ["opt4"]
        direction: in
        action: pass
        source_net: VLAN5_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        description: "opt4-20 phys-workload to internet"
        reload: false
        match_fields: ["description"]

    # -------------------------------------------------------------------------
    # Rules — opt1 (VLAN 6 — remote-access, Tailscale subnet router)
    # OUT: gateway DNS + NTP, every homelab VLAN (full admin from the tailnet —
    #      the tailnet policy decides who), internet only for Tailscale + apt.
    # IN:  nothing; only trusted (opt4-10) can reach the VM, for management.
    # Proxmox (WAN side) access is in proxmox.yml.
    # -------------------------------------------------------------------------
    - name: "opt1 | remote-access → gateway (DNS)"
      oxlorg.opnsense.rule:
        sequence: 5
        interface: ["opt1"]
        direction: in
        action: pass
        protocol: "TCP/UDP"
        source_net: VLAN6_NET
        destination_net: "10.0.6.1/32"
        destination_port: "53"
        description: "opt1-05 remote-access to gateway dns"
        reload: false
        match_fields: ["description"]

    - name: "opt1 | remote-access → gateway (NTP)"
      oxlorg.opnsense.rule:
        sequence: 6
        interface: ["opt1"]
        direction: in
        action: pass
        protocol: UDP
        source_net: VLAN6_NET
        destination_net: "10.0.6.1/32"
        destination_port: "123"
        description: "opt1-06 remote-access to gateway ntp"
        reload: false
        match_fields: ["description"]

    - name: "opt1 | remote-access → homelab (all VLANs)"
      oxlorg.opnsense.rule:
        sequence: 10
        interface: ["opt1"]
        direction: in
        action: pass
        source_net: VLAN6_NET
        destination_net: HOMELAB_ALL
        description: "opt1-10 remote-access to homelab"
        reload: false
        match_fields: ["description"]

    # The internet rules below match "not HOMELAB_ALL", which would include
    # the home LAN (ISP router admin page, other home devices). Proxmox on the
    # home LAN is allowed earlier (opt1-15, proxmox.yml).
    - name: "opt1 | remote-access → home LAN (block)"
      oxlorg.opnsense.rule:
        sequence: 18
        interface: ["opt1"]
        direction: in
        action: block
        source_net: VLAN6_NET
        destination_net: PRIVATE_NON_LAB
        description: "opt1-18 remote-access block home lan"
        reload: false
        match_fields: ["description"]

    - name: "opt1 | remote-access → internet (HTTP/HTTPS: Tailscale control, DERP, apt)"
      oxlorg.opnsense.rule:
        sequence: 20
        interface: ["opt1"]
        direction: in
        action: pass
        protocol: TCP
        source_net: VLAN6_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        destination_port: WEB_PORTS
        description: "opt1-20 remote-access to internet web"
        reload: false
        match_fields: ["description"]

    - name: "opt1 | remote-access → internet (Tailscale direct connections)"
      oxlorg.opnsense.rule:
        sequence: 21
        interface: ["opt1"]
        direction: in
        action: pass
        protocol: UDP
        source_net: VLAN6_NET
        destination_invert: true
        destination_net: HOMELAB_ALL
        destination_port: TAILSCALE_UDP
        description: "opt1-21 remote-access to internet tailscale udp"
        reload: false
        match_fields: ["description"]

    # -------------------------------------------------------------------------
    # Single reload — applies aliases and rules atomically.
    # Rule reload regenerates the full pf ruleset including alias tables,
    # so a separate alias reload is not needed here.
    # -------------------------------------------------------------------------

    # Host-type aliases are filled by OPNsense's alias updater, which only runs
    # on an alias reconfigure — a rule reload leaves them empty (and every rule
    # using them silently matches nothing).
    - name: Reconfigure aliases
      oxlorg.opnsense.raw:
        url: "firewall/alias/reconfigure"
        action: post

    - name: Reload firewall rules
      oxlorg.opnsense.reload:
        target: rule

    # Verify pf is still enabled after reload. OPNsense's reload mechanism
    # calls pfctl -d internally; if rule generation fails, pf stays disabled.
    - name: Verify pf is enabled after reload
      oxlorg.opnsense.raw:
        url: "diagnostics/firewall/pf_statistics"
        action: get
      register: pf_stats
      failed_when: false

    - name: Warn if pf status cannot be verified
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not verify pf status via API. SSH to OPNsense and
          run 'pfctl -s info | head -3' to confirm Status is Enabled.
          If disabled, run: pfctl -e && pfctl -f /tmp/rules.debug
      when: pf_stats.failed | default(false)
