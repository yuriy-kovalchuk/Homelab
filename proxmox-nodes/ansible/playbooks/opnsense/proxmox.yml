---
# Configures access to the Proxmox host (192.168.0.254).
#
#   - opt1 (remote-access) → Proxmox on TCP 22 + 8006 (trusted/opt4 reaches it
#     through its internet rule)
#   - WAN inbound block for the same ports — prevents internet-routed access
#     and documents that Proxmox should not be reachable from the WAN direction.
#
# NOTE: Proxmox (192.168.0.254) and OPNsense WAN (192.168.0.253) share the
# same L2 home network. Traffic from a home-network device directly to Proxmox
# does NOT pass through OPNsense and cannot be blocked here. Full isolation
# requires moving Proxmox's management interface to a VLAN.
#
#
- name: Configure Proxmox management access
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    - name: Create PROXMOX alias
      oxlorg.opnsense.alias:
        name: PROXMOX
        type: host
        content: ["192.168.0.254"]
        description: "Proxmox host"
        reload: false
        state: present

    - name: Create PROXMOX_PORTS alias
      oxlorg.opnsense.alias:
        name: PROXMOX_PORTS
        type: port
        content: ["22", "8006"]
        description: "Proxmox SSH and web UI"
        reload: false
        state: present

    - name: "wan | block Proxmox management inbound"
      oxlorg.opnsense.rule:
        sequence: 2
        interface: ["wan"]
        direction: in
        action: block
        protocol: TCP
        source_net: "any"
        destination_net: PROXMOX
        destination_port: PROXMOX_PORTS
        description: "wan-02 block proxmox from wan"
        reload: false
        match_fields: ["description"]

    # The trusted VLAN reaches Proxmox through its internet rule (opt4-20);
    # remote-access only has Tailscale-specific internet access, so it needs this.
    - name: "opt1 | remote-access → Proxmox management"
      oxlorg.opnsense.rule:
        sequence: 15
        interface: ["opt1"]
        direction: in
        action: pass
        protocol: TCP
        source_net: "10.0.6.0/24"
        destination_net: PROXMOX
        destination_port: PROXMOX_PORTS
        description: "opt1-15 remote-access to proxmox"
        reload: false
        match_fields: ["description"]

    # Host-type aliases are filled by OPNsense's alias updater, which only runs
    # on an alias reconfigure — a rule reload leaves them empty (and every rule
    # using them silently matches nothing).
    - name: Reconfigure aliases
      oxlorg.opnsense.raw:
        url: "firewall/alias/reconfigure"
        action: post

    - name: Reload firewall rules
      oxlorg.opnsense.reload:
        target: rule
