---
# BGP peering with the Cilium BGP Control Plane on the workload cluster.
# OPNsense ASN: 65551, router-id: 10.0.2.1 (K8sMgmt VLAN gateway)
# Peers: workload-prd nodes at 10.0.4.3-6, ASN 65002 (mgmt cluster peer decommissioned)
- name: Configure FRR BGP peering
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: "{{ opnsense_ssl_verify }}"

  tasks:
    - name: Install os-frr plugin
      oxlorg.opnsense.package:
        name: os-frr
        action: install
      register: frr_pkg

    - name: Reboot OPNsense to load FRR API endpoints
      oxlorg.opnsense.system:
        action: reboot
        wait: true
        wait_timeout: 120
      when: frr_pkg.changed

    - name: Enable FRR
      oxlorg.opnsense.frr_general:
        enabled: true
        log: true
        log_level: notifications
        reload: false

    - name: Configure BGP general (ASN + router-id)
      oxlorg.opnsense.frr_bgp_general:
        enabled: true
        as_number: 65551
        id: "10.0.2.1"
        graceful: true
        log_neighbor_changes: true
        network_import_check: false
        reload: false

    - name: Add workload cluster BGP neighbors
      oxlorg.opnsense.frr_bgp_neighbor:
        ip: "{{ item.ip }}"
        as_number: 65002
        description: "{{ item.name }}"
        next_hop_self: true
        multi_hop: false
        keepalive: 30
        hold_down: 90
        connect_timer: 120
        reload: "{{ item.last }}"
      loop:
        - { ip: "10.0.4.3", name: controlplane-1, last: false }
        - { ip: "10.0.4.4", name: worker-1, last: false }
        - { ip: "10.0.4.5", name: controlplane-2, last: false }
        - { ip: "10.0.4.6", name: controlplane-3, last: true }
