# Connection — oxlorg.opnsense uses the OPNsense API, not SSH
# Generate API key/secret in OPNsense: System → Access → Users → API Keys
ansible_connection: local

opnsense_host: "{{ lookup('env', 'OPNSENSE_HOST') }}"
opnsense_api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
opnsense_api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
opnsense_ssl_verify: false
