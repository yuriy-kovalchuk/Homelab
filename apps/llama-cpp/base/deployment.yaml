apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      initContainers:
        - name: wait-for-model
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              until [ -f /models/model.gguf ]; do
                echo "waiting for model download to complete..."
                sleep 10
              done
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: llama-cpp
          # TODO: pin to a specific build tag, e.g. server-vulkan-b5186
          # Vulkan backend: needs /dev/dri only (no ROCm). See LLAMA.md.
          image: ghcr.io/ggml-org/llama.cpp:server-vulkan
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --model
            - /models/model.gguf
            - --ctx-size
            - "4096"
            - --n-gpu-layers
            - "0"     # TODO (overlay): set to -1 once /dev/dri is mounted
            - --parallel
            - "4"
            - --cont-batching
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
