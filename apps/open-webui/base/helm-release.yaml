apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 30m
  releaseName: open-webui
  chart:
    spec:
      chart: open-webui
      version: "14.6.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Disable bundled ollama — we use llama.cpp instead
    ollama:
      enabled: false
    # Point Open WebUI at llama.cpp's OpenAI-compatible API
    openaiBaseApiUrl: "http://llama-cpp.llm.svc.cluster.local:8080/v1"
    # Disable built-in ingress — HTTPRoute is managed separately
    ingress:
      enabled: false
