apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-webui
  namespace: open-webui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  ingress:
    # Allow traffic from the Cilium gateway (Envoy proxy pods in main-gateway ns)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: main-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # llama.cpp inference backend
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llm
            app: llama-cpp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # kube-apiserver (open-webui reads k8s service account for auth)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
