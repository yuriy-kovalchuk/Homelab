---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 2m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./infrastructure/overlays/management-prd/configs
  prune: true
  wait: true
  timeout: 5m
